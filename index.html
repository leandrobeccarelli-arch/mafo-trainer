<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAFO Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef2f9;--surface:#fff;--fg:#0c1a3d;--muted:#62708f;--line:#e1e7f2;--accent:#2a62f4;--accent-fg:#fff;--soft:#e8efff;--soft-fg:#1d4fd6;
--ok:#12805c;--bad:#c2362b;--ok-bg:#e2f5ee;--bad-bg:#fcebe9;--hero:#2a62f4;
--shadow:0 1px 2px rgba(12,26,61,.04),0 10px 28px rgba(12,26,61,.06);--font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
.stack{display:grid;gap:14px}
h1{font:700 30px/1.1 var(--font);letter-spacing:-.02em;margin:0}
h2{font:700 22px/1.2 var(--font);letter-spacing:-.01em;margin:0}
h3{font:600 12px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 2px 0}
.sub{color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
button{font:600 14px/1.2 var(--font);color:var(--soft-fg);background:var(--soft);border:1px solid transparent;border-radius:999px;padding:10px 16px;cursor:pointer;transition:transform .06s,background .15s}
button:hover{border-color:var(--accent)}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg)}
.good{background:var(--ok);color:#fff}.miss{background:var(--bad);color:#fff}
.ghost{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.link{background:none;padding:4px 0;color:var(--muted);text-decoration:underline;justify-self:start;font-weight:500;border-radius:4px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:24px;display:grid;gap:18px}
.hero .sub{color:rgba(255,255,255,.78)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.13);border-radius:16px;padding:12px 14px;min-width:0}
.stat b{display:block;font:700 24px/1.1 var(--font);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:rgba(255,255,255,.8)}
.tabs{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow);overflow-x:auto}
.tabs button{flex:1;background:none;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-fg)}
.track{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.track>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.item{background:var(--surface);border-radius:20px;padding:16px 18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.item.feat{background:var(--hero);color:#fff}.item.feat .sub{color:rgba(255,255,255,.8)}.item.feat .primary{background:#fff;color:#1746c9}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.item-head b{font:600 17px/1.3 var(--font)}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--soft-fg);font-size:13px;font-weight:700;margin-right:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{background:var(--surface);color:var(--fg);border-radius:18px;padding:16px;text-align:left;display:grid;gap:4px;box-shadow:var(--shadow);font-weight:600;font-size:15px;line-height:1.3}
.tile small{font-weight:500;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:22px;padding:24px;display:grid;gap:14px;min-width:0;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.q{font:600 20px/1.35 var(--font);letter-spacing:-.01em;margin:0;text-wrap:balance}
.txt{margin:0;white-space:pre-line}
.a{border-top:1px solid var(--line);padding-top:14px;white-space:pre-line}
.opt{width:100%;text-align:left;line-height:1.4;padding:13px 16px;border-radius:14px;background:var(--bg);color:var(--fg);font-weight:500;font-size:15px}
.opt.right,.sel.right{border-color:var(--ok);background:var(--ok-bg);color:var(--fg)}.opt.wrong,.sel.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--fg)}
.ex{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;margin:0;white-space:pre-line}
.slide{width:100%;height:auto;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;display:block}
.src{font-size:12px;color:var(--muted);margin:0}
ol.done{margin:0;padding-left:22px;display:grid;gap:4px}
.big{font:700 40px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rev{border-top:1px solid var(--line);padding-top:10px;font-size:14px}.rev b{display:block}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
caption{text-align:left;font-weight:600;padding:10px 12px 4px;font-size:13px;color:var(--muted)}
th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:12px;border-top:0}th:first-child,td:first-child{text-align:left}
.fld{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.fld label{font-weight:500;font-size:15px}
.inp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
input[type=text]{font:600 16px/1.2 var(--font);width:130px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:right}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
input.right{border-color:var(--ok);background:var(--ok-bg)}input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fld .fix{grid-column:1/-1;font-size:13px;color:var(--bad);margin:-2px 0 4px;text-align:right}
.sel{padding:9px 14px;background:var(--bg);color:var(--fg)}.sel[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
#r-card .sel.right{background:var(--ok-bg);border-color:var(--ok);color:var(--fg)}#r-card .sel.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--fg)}
textarea{font:400 15px/1.5 var(--font);width:100%;min-height:92px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);resize:vertical}
.part{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.part>b{font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
@media (max-width:520px){.fld{grid-template-columns:minmax(0,1fr);gap:4px}.fld label{margin-top:8px}.inp{justify-content:flex-start}.fld .fix{text-align:left}.sel{white-space:normal;text-align:left}.stat b{font-size:20px}.card{padding:18px}.q{font-size:18px}input[type=text]{width:110px}}
</style></head><body><div class="wrap">
<section id="v-home" class="stack">
<div class="hero"><div><h1>MAFO Trainer</h1><p class="sub">Marktforschung für die Prüfung Marketingfachleute</p></div><div class="stats" id="h-stats"></div></div>
<div class="tabs" id="h-tabs" role="tablist"></div>
<div id="h-body" class="stack"></div>
</section>
<section id="v-run" class="stack" hidden>
<div class="bar"><button id="back" class="ghost">← Übersicht</button><p class="sub" id="r-count"></p></div>
<div><h2 id="r-title"></h2><p class="sub" id="r-mode"></p></div>
<div class="track"><i id="r-bar"></i></div>
<div class="card" id="r-card" aria-live="polite"></div>
</section>
</div>
<script>
const CARDS=[{"k": "Grundlagen", "q": "Wie wird Marktforschung definiert?", "a": "Systematische, objektive und professionelle Beschaffung und verwendungsgerechte Aufbereitung von Informationen, unter Anwendung wissenschaftlicher Methoden.\n… um Trends zu erkennen, Potenziale zu ermitteln und Risiken zu minimieren."}, {"k": "Grundlagen", "q": "Welche Möglichkeiten bietet die Marktforschung?", "a": "• Marktbeobachtung\n• Distributions- und Werbeanalyse\n• Imagemässige Profilierung und Positionierung der Marken\n• Untersuchung des Konsumentenverhaltens\n• Analyse der Kaufmotive und Kaufbarrieren\n• Pretesting vor Produkte-Einführungen"}, {"k": "Grundlagen", "q": "Wo stösst die Marktforschung an ihre Grenzen?", "a": "• Fehlendes Geld\n• Fehlende Zeit\n• Methodische Grenzen\n• Mangelndes Verständnis im Management\n• Mangelnder Wille, die Ergebnisse zu akzeptieren\n• Marktforschung als Bestätigung statt zur Erkenntnisfindung\n• Beschränkte Genauigkeit der Resultate"}, {"k": "Grundlagen", "q": "Wie ist die Marktforschung in der Praxis organisatorisch eingegliedert?", "a": "Stabsstelle des Marketings und des Verkaufs (Schnittstelle der beiden Abteilungen). Auch der Category Manager erfüllt die Funktion des internen Marktforschers."}, {"k": "Grundlagen", "q": "In welche zwei Formen wird die Marktforschung grundsätzlich unterschieden?", "a": "Primärforschung und Sekundärforschung."}, {"k": "Grundlagen", "q": "Wie unterscheiden sich Marktforschung und Marketingforschung (Meffert)?", "a": "• Marktforschung: Absatzmarkt (Marktpotential, Absatzpotentiale einer Unternehmung, Marktvolumen, Markentreue, Produkttest) und Beschaffungsmarkt (Arbeitsmarkt, Kapitalmarkt, Rohstoffmarkt)\n• Zusätzlich: Marketingaktivitäten (Distributions-, Preis-, Kommunikations-, Konsumentenverhaltensforschung) und innerbetriebliche Sachverhalte (EDV-Planung, Vertriebskostenanalyse, Kapazitätsprogramme, Lagerplanung).", "s": "Teil 1, Folie 6"}, {"k": "Grundlagen", "q": "Was bedeutet «Analysieren Sie:» immer?", "a": "1. Relevante Fakten sammeln\n2. Erkenntnisse gewinnen\n3. Empfehlungen / Entscheide treffen", "s": "Teil 2, Folie 41/44; Teil 3, Folie 14"}, {"k": "Grundlagen", "q": "Aus welchen Elementen besteht das Marktsystem?", "a": "• Konkurrenz\n• Produktverwender (Käufer)\n• Absatzmittler (Wiederverkäufer)\n• Beschaffungsmarkt (Produzenten, Rohstofflieferanten)\n• Umweltfaktoren\n• Externe Beeinflusser und interne Beeinflusser\nGehört zum Schritt «Relevante Fakten sammeln».", "s": "Teil 1, Folie 8; Teil 4, Folie 3"}, {"k": "Grundlagen", "q": "Wie ist eine Analyse von Panel-Zahlen gegliedert («Analysieren Sie»)?", "a": "1. Relevante Fakten sammeln\n2. Erkenntnisse gewinnen (und bewerten)\n3. Empfehlungen / Entscheide treffen\nRaster: Analyse Zahlen und Fakten → Fazit → Massnahmen Marktleader.", "s": "Teil 3, Folie 14, 24"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Beschreiben Sie / Begründen Sie»: Was müssen Sie machen?", "a": "In Fliesstext oder stichwortartig beschreiben und begründen", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Nennen Sie»: Was müssen Sie machen?", "a": "Aufzählen, meist mit Beschreibung", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Diskutieren Sie»: Was müssen Sie machen?", "a": "Pro / Kontra / Vor- und Nachteile", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Evaluieren Sie»: Was müssen Sie machen?", "a": "Nutzwertanalyse", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Bewerten Sie»: Was müssen Sie machen?", "a": "Bewertungsskala (evtl. Priorisieren)", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Analysieren Sie»: Was müssen Sie machen?", "a": "Chancen / Gefahren mit relevanten Fakten", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Schlüsselbegriff «Identifizieren Sie»: Was müssen Sie machen?", "a": "Aufzählen, meist mit Beschreibung", "s": "Analyse Schema TOOLS, Folie 3"}, {"k": "Analyse-Tools", "q": "Welche Schlüsselbegriffe kommen in Prüfungsaufgaben vor und was wird jeweils verlangt?", "a": "• Beschreiben Sie / Begründen Sie: in Fliesstext / stichwortartig beschreiben und begründen\n• Nennen Sie: aufzählen, meist mit Beschreibung\n• Diskutieren Sie: Pro / Kontra / Vor- und Nachteile\n• Evaluieren Sie: Nutzwertanalyse\n• Bewerten Sie: Bewertungsskala (evtl. Priorisieren)\n• Analysieren Sie: Chancen / Gefahren mit relevanten Fakten\n• Identifizieren Sie: aufzählen, meist mit Beschreibung", "s": "Analyse Schema TOOLS, Folie 3", "img": "img/tools_3.jpg"}, {"k": "Analyse-Tools", "q": "Was wird bei «Nennen Sie» und «Identifizieren Sie» verlangt?", "a": "• Beide Begriffe: Aufzählen, meist mit Beschreibung", "s": "Analyse Schema TOOLS, Folie 3", "img": "img/tools_3.jpg"}, {"k": "Analyse-Tools", "q": "Was wird bei «Diskutieren Sie», «Evaluieren Sie» und «Bewerten Sie» verlangt?", "a": "• Diskutieren Sie: Pro / Kontra / Vor- und Nachteile\n• Evaluieren Sie: Nutzwertanalyse\n• Bewerten Sie: Bewertungsskala (evtl. Priorisieren)", "s": "Analyse Schema TOOLS, Folie 3", "img": "img/tools_3.jpg"}, {"k": "Analyse-Tools", "q": "Was wird bei «Beschreiben Sie» / «Begründen Sie» und bei «Analysieren Sie» verlangt?", "a": "• Beschreiben Sie / Begründen Sie: In Fliesstext / stichwortartig beschreiben und begründen\n• Analysieren Sie: Chancen / Gefahren mit relevanten Fakten", "s": "Analyse Schema TOOLS, Folie 3", "img": "img/tools_3.jpg"}, {"k": "Analyse-Tools", "q": "Wie gehen Sie bei einer Analyse vor (Analyse-Schema)?", "a": "1. Relevante Fakten sammeln\n2. Relevante Fakten bewerten (Fakten sortieren und bewerten)\n3. Erkenntnisse gewinnen = Fazit\n4. Entscheid / Empfehlung\n5. Entscheid / Empfehlung begründen\nAls Trichter: Fakten sammeln → Fakten sortieren und bewerten → Fazit / Erkenntnis → Entscheid → Entscheid begründen.", "s": "Analyse Schema TOOLS, Folie 4, 5, 14", "img": "img/tools_4.jpg"}, {"k": "Analyse-Tools", "q": "Wie gehen Sie bei der SWOT-Analyse nach dem Analyse-Schema vor?", "a": "• Relevante Fakten sammeln: Marktsystem / Situationsanalyse\n• Relevante Fakten bewerten: Tabelle mit Bewertung, aus Beilagen bzw. SWOT, fokussiert auf die Aufgabenstellung\n• Erkenntnisse gewinnen = Fazit (Erkenntnis aus SWOT): «Marktattraktiv weil…» / «Marktfähig weil…»\n• Entscheid / Empfehlung und Begründung", "s": "Analyse Schema TOOLS, Folie 14", "img": "img/tools_14.jpg"}, {"k": "Analyse-Tools", "q": "Wie gehen Sie bei der BCG-Analyse nach dem Analyse-Schema vor?", "a": "• Relevante Fakten sammeln: 1. Marktwachstum, 2. Marktanteil berechnen, falls nicht vorhanden\n• Relevante Fakten bewerten: BCG-Matrix (Marktwachstum in % / relativer Marktanteil)\n• Erkenntnisse / Fazit: Chancen / Potenziale?\n• Empfehlung: was ist zu tun\n• Begründung: Was bringt die Massnahme uns konkret?", "s": "Analyse Schema TOOLS, Folie 15", "img": "img/tools_15.jpg"}, {"k": "Analyse-Tools", "q": "Welche drei Ebenen werden von der Vision bis zum Marketing-Mix unterschieden und was gehört dazu?", "a": "• Unternehmens-strategische Ebene: Vision, Leitbild, SEP, Unternehmensstrategie, SGF1 / SGF2 / SGF3 (mit Analyse)\n• Marketing-strategische Ebene: Marketingkonzept mit Analyse, Ziele, Kontrolle\n• (Marketing) Operative Ebene: Product, Price, Promo, Place", "s": "Analyse Schema TOOLS, Folie 6", "img": "img/tools_6.jpg"}, {"k": "Analyse-Tools", "q": "Welche Schritte hat die Marketingstrategie nach Kühn?", "a": "1. Analyse\n2. Teilmarkt / Segmententscheid\n3. Wettbewerbsstrategie und Positionierung\n4. Wirtschaftliche Grobziele\n5. Marktbearbeitungsstrategie\n6. Marketing Grobmix\n7. Marketing Infrastruktur\n8. Marketing Budget und Kontrolle", "s": "Analyse Schema TOOLS, Folie 2", "img": "img/tools_2.jpg"}, {"k": "Analyse-Tools", "q": "Welche Analyse-Tools sind den Schritten der Marketingstrategie nach Kühn zugeordnet?", "a": "• Teilmarkt / Segment: NZW-Analyse (Nutzwertanalyse), BCG\n• Wettbewerbsstrategie: Wettbewerbsstrategie nach Porter (Preis-Mengen-Strategie / Präferenz-Strategie)\n• Marktbearbeitungsstrategie: Anforderungsprofile, NZW-Analyse\n• Unternehmensstrategie: Strategie nach Ansoff\n• Tool-Liste im Gesamtschema: Benchmarking, Mystery Shopping, Nutzwertanalyse, BCG Portfolio Analyse, Mc Kinsey Portfolio Analyse, APP, Stärken / Schwächen Analyse, Risikoanalyse, Konkurrenzanalyse (Pfeil auf Teilmarkt-Segment-Entscheid; die Konkurrenzanalyse zeigt auf die Marktbearbeitungsstrategie)", "s": "Analyse Schema TOOLS, Folie 8; Unterricht 06.05.2026, Folie 6", "img": "img/tools_8.jpg"}, {"k": "Analyse-Tools", "q": "Wie führt die Analyse von der Situationsanalyse zur Unternehmensstrategie?", "a": "• Marktsystem (Situationsanalyse) und SWOT (Bild-Inputs: Five Forces Model, McKinsey 7S Framework)\n• Fazit: Marktfähigkeit und Marktattraktivität\n• Unternehmensstrategische Ebene: Wachstumsstrategien nach Ansoff", "s": "Analyse Schema TOOLS, Folie 7", "img": "img/tools_7.jpg"}, {"k": "Analyse-Tools", "q": "Welche fünf Kräfte umfasst das Porter-5-Forces-Modell?", "a": "• Threat of new entrants (Bedrohung durch neue Anbieter)\n• Bargaining power of suppliers (Verhandlungsmacht der Lieferanten)\n• Bargaining power of buyers (Verhandlungsmacht der Käufer)\n• Threat of substitute products (Bedrohung durch Ersatzprodukte)\n• Rivalry among existing competitors (Rivalität unter bestehenden Wettbewerbern) im Zentrum", "s": "Analyse Schema TOOLS, Folie 11", "img": "img/tools_11.jpg"}, {"k": "Analyse-Tools", "q": "Nennen Sie Beurteilungskriterien der Porter-5-Forces (je Kraft ein bis zwei Beispiele).", "a": "• Rivalry among existing competitors: Number of competitors, Industry growth, Barriers to exit\n• Threat of new entrants: Barriers to entry, Economies of scale, Capital requirements\n• Bargaining power of suppliers: Number and size of suppliers, Uniqueness of each supplier's product\n• Bargaining power of buyers: Number of customers, Price sensitivity\n• Threat of substitute products: Number of substitute products available, Relative price performance of substitute", "s": "Analyse Schema TOOLS, Folie 11", "img": "img/tools_11.jpg"}, {"k": "Analyse-Tools", "q": "Welche zwei Strategien umfasst «Wettbewerbsstrategie Porter»?", "a": "• Preis-Mengen Strategie\n• Präferenz Strategie\nSie gehören zum Kühn-Schritt Wettbewerbsstrategie.", "s": "Analyse Schema TOOLS, Folie 8", "img": "img/tools_8.jpg"}, {"k": "Analyse-Tools", "q": "Was versteht man unter einer SWOT-Analyse (Aufbau und Leitfragen)?", "a": "• Intern: Stärken (Welche Kernkompetenzen und welchen Leistungsvorsprung hat das Unternehmen?) und Schwächen (Welche interne Probleme gibt es und mit welchem Entwicklungsbedarf hat das Unternehmen zu kämpfen?)\n• Extern: Chancen (Welche Möglichkeiten für einen Wettbewerbsvorteil bieten sich?) und Risiken / Gefahren (Welche Trends und Entwicklungen könnten zu Verlusten führen, wenn nicht gehandelt wird?)\n• Positiv: Stärken, Chancen; negativ: Schwächen, Risiken", "s": "Analyse Schema TOOLS, Folie 16", "img": "img/tools_16.jpg"}, {"k": "Analyse-Tools", "q": "Welches Fazit leiten Sie aus der SWOT-Analyse ab?", "a": "• Stärken und Schwächen → Marktfähigkeit: «Wir sind marktfähig weil… (USP und andere Stärken)»\n• Chancen (Potenziale) und Gefahren → Marktattraktivität: «Der Markt ist attraktiv weil…»\n• Danach: Entscheid inkl. Begründung + Strategieansatz", "s": "Unterricht 06.05.2026, Folie 4; Teil 1, Folie 9; Analyse Schema TOOLS, Folie 14", "img": "img/u_4.jpg"}, {"k": "Analyse-Tools", "q": "Wie sieht das SWOT-Beispiel «Airfryer» aus dem Unterricht aus?", "a": "• Stärken: USP\n• Schwächen: noch kein Onlineshop\n• Chancen: 2-stellig wachsender Markt, insbesondere im Online-Handel\n• Gefahren: neue Pandemie und Lockdowns", "s": "Unterricht 06.05.2026, Folie 5", "img": "img/u_5.jpg"}, {"k": "Analyse-Tools", "q": "Welche Strategien leiten Sie aus der SWOT-Matrix ab?", "a": "• SO-Strategie (Stärken × Chancen): «Ausbauen»\n• WO-Strategie (Schwächen × Chancen): «Aufholen»\n• ST-Strategie (Stärken × Risiken): «Absichern»\n• WT-Strategie (Schwächen × Risiken): «Vermeiden»\nSpalten: Stärken / Schwächen (interne Analyse); Zeilen: Chancen / Risiken (externe Analyse, Entwicklungen im Umfeld).", "s": "Analyse Schema TOOLS, Folie 17", "img": "img/tools_17.jpg"}, {"k": "Analyse-Tools", "q": "Wie lauten die Strategien der SWOT-Matrix im Beispiel «Airfryer»?", "a": "• Stärke / Chancen: Profilierung mit USP im Onlinehandel\n• Schwäche / Chance: Aufbau eines eigenen Onlineshops mit Marketplace-Präsenz\n• Schwächen / Gefahren: Prävention (Schadensbegrenzung)", "s": "Unterricht 06.05.2026, Folie 5", "img": "img/u_5.jpg"}, {"k": "Analyse-Tools", "q": "Welche vier Wachstumsstrategien nach Ansoff gibt es und wie sind sie definiert?", "a": "• Marktpenetration: bestehende Produkte in bestehende Märkte\n• Produktentwicklungsstrategie: neues Produkt in bestehende Märkte\n• Marktentwicklung: bestehende Produkte in neue Märkte\n• Diversifikation: neue Produkte in neue Märkte\nEinordnung: Unternehmensstrategische Ebene.", "s": "Unterricht 06.05.2026, Folie 6; Analyse Schema TOOLS, Folie 7", "img": "img/u_6.jpg"}, {"k": "Analyse-Tools", "q": "Was zeigt die BCG-Matrix (Achsen und vier Felder)?", "a": "• Achsen: Marktwachstum in % (hoch oben) und relativer Marktanteil (hoch rechts)\n• Question Marks: Marktwachstum hoch, relativer Marktanteil niedrig\n• Stars: Marktwachstum hoch, relativer Marktanteil hoch\n• Poor Dogs (Dogs): Marktwachstum niedrig, relativer Marktanteil niedrig\n• Cash Cows: Marktwachstum niedrig, relativer Marktanteil hoch", "s": "Analyse Schema TOOLS, Folie 15, 19; Teil 3, Folie 61", "img": "img/tools_15.jpg"}, {"k": "Analyse-Tools", "q": "Welche Merkmale haben die vier Felder der BCG-Matrix?", "a": "• Question Marks: Hoher Aufwand, niedriger Marktanteil, keine Rendite; Entscheidung ob investieren oder eliminieren\n• Stars: Schnelles Wachstum, erzielen Gewinne, benötigen weitere Investitionen, müssen ausgebaut werden\n• Dogs: Erwirtschaften keine Gewinne mehr, geringes Marktwachstum, evtl. Marktschwund, evtl. Desinvestition\n• Cash Cows: Hoher Marktanteil, finanzieren andere Geschäftsfelder, hoher Cash-Flow, abschöpfen", "s": "Analyse Schema TOOLS, Folie 19", "img": "img/tools_19.jpg"}, {"k": "Analyse-Tools", "q": "Wie ermitteln Sie die Zahlen für die BCG-Analyse (Marktwachstum, Marktanteil)?", "a": "• Marktwachstum in % = (Marktvolumen dieses Jahr − Vorjahr) ÷ Vorjahr × 100\n• Marktanteil = eigener Umsatz ÷ Marktvolumen × 100 (berechnen, falls nicht vorhanden)\n• Relativer Marktanteil = eigener Marktanteil ÷ Marktanteil des grössten Konkurrenten\n• Relativer Marktanteil über 1.0 = hoch, unter 1.0 = niedrig", "s": "Analyse Schema TOOLS, Folie 15", "img": "img/tools_15.jpg"}, {"k": "Analyse-Tools", "q": "Was zeigt die 9-Felder-Matrix nach McKinsey (Achsen und Felder)?", "a": "• Y-Achse: Marktattraktivität (− unten, + oben)\n• X-Achse: relative Wettbewerbsstärke (− links, + rechts)\n• Obere Reihe: Selektiv Ausbauen | Ausbauen / Investieren | Position Verteidigen\n• Mittlere Reihe: Ernten | Selektiv Ausbauen / Gewinnfokus | Selektiv\n• Untere Reihe: Desinvestieren | Gewinnfokus | Verteidigen / Selektiver Neufokus\n• Beispiel-Kugeln A bis D positionieren Geschäftsfelder", "s": "Analyse Schema TOOLS, Folie 18", "img": "img/tools_18.jpg"}, {"k": "Analyse-Tools", "q": "Wie ist die Chancen-/Risiken-Analyse aufgebaut?", "a": "• Vergleich von zwei Projekten (Kinderschuhe, Schuh-Abo) mit je Beurteilung (Chancen / Risiken) und Gewichtung\n• Kriteriengruppen: Käufer (Neue Zielgruppe, Kundenbindung); Produkt (Sortimentserweiterung, Kompetenzerweiterung); Distribution (Neue Händlernetzwerk, Neue Distributionswege); Kommunikation (Profilierungsmöglichkeiten, Synergien bestehende); Prozesse (Integration in bestehende Prozesse, Ressourcenaufwand, Fristigkeit Umsetzung)", "s": "Analyse Schema TOOLS, Folie 20", "img": "img/tools_20.jpg"}, {"k": "Analyse-Tools", "q": "Wie gehen Sie bei einer Nutzwertanalyse (NZW) vor?", "a": "• Beurteilungskriterien festlegen (quantitative und qualitative)\n• Gewichtung der Kriterien in % (Summe 100)\n• Bewertung ungewichtet pro Alternative nach Beurteilungsskala (1 = sehr niedrig, 2 = eher niedrig; Werte bis 4 im Beispiel)\n• Gewichtet = Gewichtung × Bewertung (aus den Zahlen abgeleitet)\n• Total Punkte gewichtet pro Alternative bilden\n• Entscheid mit Begründung\nSchlüsselbegriff «Evaluieren Sie» verlangt die Nutzwertanalyse.", "s": "Analyse Schema TOOLS, Folie 21, 3", "img": "img/tools_21.jpg"}, {"k": "Analyse-Tools", "q": "Welche Kriterien enthält das Nutzwertanalyse-Beispiel «Distributions- / Kanalanalyse» und wie sind sie gewichtet?", "a": "• Quantitative Kriterien: Anzahl Filialen (5 %), Listinggebühren (15 %), Preiskategorie des Retailers (15 %), Umsatzpotenzial WOP (25 %)\n• Qualitative Kriterien: Imagekonformität (10 %), Stellenwert Nachhaltigkeit des Retailers (5 %), Einkaufserlebnis hat hohe Bedeutung (10 %), Zielgruppenaffinität (15 %)\n• Alternativen: Reformhaus, Alnatura, Globus, Migros, Coop", "s": "Analyse Schema TOOLS, Folie 21", "img": "img/tools_21.jpg"}, {"k": "Analyse-Tools", "q": "Wie ist ein Anforderungsprofil aufgebaut (Beispiel Influencer)?", "a": "• Spalten: Kriterien, Muss, Kann, Bewertungsraster Influencer (1 bis 5)\n• Fachliche Anforderung, z. B. sehr gute Ausdrucksweise in Deutsch (Muss), Follower-Zahl grösser 50'000 (Kann), Budget pro Jahr maximal CHF 20'000 (Muss)\n• Charakterliche Anforderungen, z. B. stärkt WOP-Image (Muss), kann mit Kritik umgehen (Kann)\n• Persönliche Anforderungen, z. B. Wohnort Schweiz (Kann), Idealalter 30-45 (Kann)\nEinordnung: Marktbearbeitungsstrategie (Anforderungsprofile, NZW-Analyse).", "s": "Analyse Schema TOOLS, Folie 22, 8", "img": "img/tools_22.jpg"}, {"k": "Analyse-Tools", "q": "Wie ist die Risikoanalyse (Risikomatrix) aufgebaut?", "a": "• Achse Auswirkungen: Gross / Mittel / Klein\n• Achse Eintrittswahrscheinlichkeit: Gering / Möglich / Wahrscheinlich / Beinahe sicher\n• Farbfelder von grün (klein / gering) bis dunkelrot (gross / beinahe sicher)\n• Risiken sind nummeriert und im Feld eingetragen (Beispiel: Risiko 5 = gross / beinahe sicher)", "s": "Analyse Schema TOOLS, Folie 23", "img": "img/tools_23.jpg"}, {"k": "Analyse-Tools", "q": "Welche Spalten hat die Risikoanalyse (APP) in Bezug auf wirkungsarme / wirkungslose Aktivitäten?", "a": "• Hauptrisiken\n• Beschreibung\n• Eintrittswahrscheinlichkeit\n• Eventualmassnahme Risikominimierung / Korrektur\n• Begründung\n• Verantwortlicher", "s": "Analyse Schema TOOLS, Folie 24", "img": "img/tools_24.jpg"}, {"k": "Analyse-Tools", "q": "Was zeigt eine Positionierungsspinne?", "a": "• Netzdiagramm mit acht Achsen: Produkte Dienstleistungen, Qualität, Preis, Serviceleistungen, Partnerschaften Oekosysteme, Corporate Design, Innovation, Nachhaltigkeit\n• Skala 2 bis 10\n• Vergleich: Eigenes Unternehmen (weiss) und Konkurrent 1 (rot)\n• Beispiel (aus Grafik abgelesen): Eigenes Unternehmen vorne bei Produkte Dienstleistungen, Innovation, Partnerschaften Oekosysteme; Konkurrent 1 vorne bei Qualität, Preis, Corporate Design, Nachhaltigkeit", "s": "Analyse Schema TOOLS, Folie 26", "img": "img/tools_26.jpg"}, {"k": "Analyse-Tools", "q": "Was versteht man unter Szenarioanalyse mit Best Case und Worst Case?", "a": "• Szenariotrichter von t0 (Ist-Zustand) über t1, t2, t3 bis t4 (Szenarioebene), Zeit t\n• Oben: Best-Case-Szenario\n• Mitte: Trendszenario\n• Unten: Worst-Case-Szenario\n• Vom gegenwärtigen Umfeld zum zukünftigen Umfeld", "s": "Analyse Schema TOOLS, Folie 28", "img": "img/tools_28.jpg"}, {"k": "Analyse-Tools", "q": "Aus welchen sechs Schritten besteht die klassische Szenarioanalyse?", "a": "1. Situation Analysis (Definition of the own business, of the ecosystem; identification of evaluation criteria)\n2. Interviews & Observations (identify critical factors)\n3. Factor Identification (list and classify the factors)\n4. Key Driver Identification (active / passive matrix; selection of key drivers)\n5. Scenario (build projections based on key drivers; consistency analysis, calculation and selection of scenarios)\n6. Scenario Impact Analysis (scenario description; risk analysis of scenarios; strategic recommendations)", "s": "Analyse Schema TOOLS, Folie 27, 29", "img": "img/tools_27.jpg"}, {"k": "Analyse-Tools", "q": "Welche sechs Phasen hat der Produktlebenszyklus?", "a": "1. Entwicklung\n2. Einführung\n3. Wachstum\n4. Reife\n5. Sättigung\n6. Rückgang\nAchsen: Umsatz / Gewinn (y), Zeit (x).", "s": "Teil 3, Folie 62", "img": "img/t3_62.jpg"}, {"k": "Analyse-Tools", "q": "Wie verlaufen Umsatz und Gewinn im Produktlebenszyklus?", "a": "• Umsatz: beginnt bei null zu Beginn der Einführung, steigt in Einführung und Wachstum, Höhepunkt in der Reife, sinkt in Sättigung und Rückgang, am Ende wieder null\n• Gewinn: negativ in Entwicklung und Einführung, Nulllinie am Übergang Einführung / Wachstum, Höhepunkt zu Beginn der Reife (vor dem Umsatzmaximum), sinkt in Reife und Sättigung, Nulllinie am Übergang Sättigung / Rückgang, im Rückgang wieder negativ", "s": "Teil 3, Folie 62", "img": "img/t3_62.jpg"}, {"k": "Sekundär und Primär", "q": "Was versteht man unter sekundärer Marktforschung (Desk Research)?", "a": "Desk Research: stützt sich auf bereits vorhandene Informationen, die für einen anderen Zweck oder aus allgemeinem Interesse (Stat. Bundesamt) zusammengetragen wurden."}, {"k": "Sekundär und Primär", "q": "Nennen Sie innerbetriebliche Quellen der Sekundärforschung.", "a": "• Absatzstatistiken\n• Produktionsstatistiken\n• Planungsunterlagen\n• Informationen des Rechnungswesens\n• Rapporte über Kunden- und Messebesuche\n• Alte Marktforschungsunterlagen"}, {"k": "Sekundär und Primär", "q": "Nennen Sie ausserbetriebliche Quellen der Sekundärforschung.", "a": "• Staatliche und halbstaatliche Institutionen\n• Verbände\n• Marktforschungsinstitute\n• Banken\n• Fachzeitschriften\n• Forschungsberichte, Dissertationen\n• Tagespresse\n• Preislisten und Werbematerial der Konkurrenz\n• Messen und Ausstellungen"}, {"k": "Sekundär und Primär", "q": "Welche zwei Arten der primären Marktforschung werden unterschieden?", "a": "AD-HOC-Forschung und Panelforschung."}, {"k": "Sekundär und Primär", "q": "Was ist AD-HOC-Forschung?", "a": "Befasst sich mit einer aktuell auftretenden Fragestellung. Momentaufnahme.\nField Research: Informationen für eine bestimmte Problemstellung mit einer eigens dafür konzipierten Erhebung."}, {"k": "Sekundär und Primär", "q": "Welche Merkmale hat die Panelforschung und wie unterscheidet sie sich von AD-HOC?", "a": "• Regelmässig wiederkehrend\n• In zeitlich gleichmässigen Abständen\n• In der gleichbleibenden, repräsentativen Stichprobe\n• Unter Anwendung derselben Methode\n• Zum selben Untersuchungsgegenstand\nAD-HOC = Momentaufnahme, Panel = Film (zeigt Entwicklungen)."}, {"k": "Sekundär und Primär", "q": "Mit welchen Erhebungstechniken werden bei AD-HOC-Forschung Informationen gewonnen?", "a": "• Befragung = Personen werden spezifische Fragen gestellt\n• Beobachtung = Verhalten der Personen beobachten\n• Test bzw. Experiment = Personen werden auf bestimmte Reize getestet"}, {"k": "Sekundär und Primär", "q": "Welche Beobachtungsarten gibt es?", "a": "• Feldbeobachtung = Verhalten der Kunden in der Einkaufsstätte, Zählen oder Messen\n• Laborbeobachtung = unter kontrollierten Bedingungen im Labor\nZusätzlich nach Wissen des Probanden: biotisch (weiss nicht Bescheid), semibiotisch (teilweise), unbiotisch (voll und ganz).", "s": "Teil 1, Folie 17"}, {"k": "Sekundär und Primär", "q": "Was ist der Unterschied zwischen Labortest, Markttest und Testmarkt?", "a": "• Labortest / TESI = im Forschungslabor, psychische und physiologische Reaktionen\n• Markttest = in einem abgrenzbaren Markt, gesamter Marketingmix\n• Testmarkt = abgegrenzter Markt, in dem Markttests durchgeführt werden"}, {"k": "Sekundär und Primär", "q": "Was bedeuten biotisch, semibiotisch und unbiotisch (Beobachten)?", "a": "• Biotisch: Proband weiss nicht Bescheid, dass er beobachtet wird; es findet keine Befragung statt\n• Semibiotisch: Proband weiss nur teilweise Bescheid; Befragung findet statt, eher qualitative Methode\n• Unbiotisch: Proband weiss voll und ganz über Beobachtung / Test Bescheid; Befragung findet statt, eher quantitative Methode", "s": "Teil 1, Folie 17"}, {"k": "Sekundär und Primär", "q": "Was ist der Unterschied zwischen AD-HOC-Forschung und Panelforschung?", "a": "AD-HOC: Einmalige Momentaufnahme zu einem bestimmten Zweck; Befragung, Beobachtung oder Test; bei jeder Befragung neue Stichprobe; Ergebnisse gelten in diesem Moment; nicht zwingend repräsentativ.\nPanel: Regelmässig wiederkehrend; gleichbleibende, repräsentative Stichprobe / Universum; in zeitlich gleichmässigen Abständen; Anwendung derselben Methode; gleicher Untersuchungsgegenstand.", "s": "Teil 1, Folie 11; Teil 5, Folie 4"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist eine Vollerhebung und wann wird sie angewandt?", "a": "Alle relevanten Personen (Grundgesamtheit) werden befragt. Bei relativ kleiner Zahl; bei sehr grosser Grundgesamtheit nur bei der Volkszählung."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist eine Teilerhebung und welche Probleme stellen sich dabei?", "a": "Nur ein Teil (Stichprobe) der Grundgesamtheit. Probleme:\n• Repräsentanz\n• Grösse der Erhebungseinheiten\n• Zulässige Fehlerspanne\n• Grundsätze für die Wahl der Erhebungseinheiten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Hängt die Genauigkeit einer Stichprobe von der Grösse des Universums ab?", "a": "Je mehr Leute befragt werden, umso genauer. Die Genauigkeit hängt nicht von der Grösse des Universums ab: 1'000 Personen bei 8 Mio. sind gleich genau wie bei 4'000."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was bedeutet Repräsentativität und welchen Einfluss hat die Stichprobengrösse darauf?", "a": "Je genauer die Stichprobe der Grundgesamtheit entspricht, desto grösser die Repräsentativität. Dann kann hochgerechnet (extrapoliert) werden.\nDie Stichprobengrösse beeinflusst nur die Genauigkeit, nicht die Repräsentativität."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Wann und wie funktioniert die Zufallsauswahl (Random-Verfahren)?", "a": "• Reines Zufallsverfahren: jedes Element des Universums hat die gleiche Chance, in die Stichprobe zu kommen.\n• Voraussetzung: alle Elemente des Universums müssen bekannt und ansprechbar sein.\n• Vorteil: Vertrauensintervall mathematisch berechenbar.", "s": "Teil 2, Folie 18; Teil 5, Folie 13"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche Arten der Zufallsauswahl gibt es?", "a": "• Reine Zufallsauswahl = Lotterieverfahren (Urne)\n• Geschichtete Zufallsauswahl (im Skript «gesichtete») = Untergruppen (Schichten), darin reiner Zufall\n• Klumpen-Auswahl (Cluster) = zufällige «Klumpen» mit allen Elementen"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche nichtzufälligen Auswahlverfahren gibt es und was setzen sie voraus?", "a": "Struktur der Grundgesamtheit muss bekannt sein.\n• Quota-Verfahren = Interviewer erhält Quoten von Merkmalen (Alter, Geschlecht, Kaufkraft)\n• Willkürliche Auswahl = Interviewer wählt nach Geratewohl; billigstes, am wenigsten repräsentativ"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche systematischen Fehler gibt es?", "a": "Entstehen durch individuelle Fehlleistungen:\n• Planungsfehler\n• Auswertungsfehler\n• Interviewer-Fehler (falsches Ausfüllen)\n• Fehler durch Befragten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Wodurch entstehen Zufallsfehler und wovon hängen sie ab?", "a": "Entstehen, weil mit einer Stichprobe gearbeitet wird (Resultate stimmen nicht mit einer Vollerhebung überein).\nd = t × √(p × q ÷ n): abhängig von\n• Stichprobengrösse (n)\n• Merkmalsverteilung (p, q)\n• Sicherheitsgrad (t), in der Regel t2 = 95.5 %", "s": "Teil 2, Folie 43, 49"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was versteht man unter dem Zufallsfehler (Stichprobenfehler) und wie wird er berechnet?", "a": "• Berechenbarer Fehler: Aus den Ergebnissen der Stichprobe wird auf die Grundgesamtheit geschlossen. Diese Resultate stimmen nicht mit einer Vollerhebung überein.\n• Vertrauensbereich d = t × √(p × q ÷ n)\n• Synonyme: Stichprobenfehler, Vertrauensbereich, Genauigkeit\n• Wird berechnet, nachdem die Befragung stattgefunden hat.", "s": "Teil 2, Folie 43, 47–49"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was bedeuten die Symbole in der Formel des Zufallsfehlers?", "a": "• e (bzw. d) = Zufallsfehler / Vertrauensbereich\n• t = Wahrscheinlichkeit (in σ), meist 95.5 % = 2σ\n• p, q = Anteilswerte der Antwortverteilung (z. B. Ja / Nein)\n• n = Stichprobengrösse", "s": "Teil 2, Folie 49"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Rechenbeispiel Zufallsfehler: 53 % Ja, 47 % Nein, Basis 300 Interviews. Was ist das Ergebnis?", "a": "d = 2 × √(53 × 47 ÷ 300) = ±5.76\n• 53 % liegt mit 95.5 %iger Wahrscheinlichkeit zwischen 47.2 und 58.8 %\n• 47 % liegt zwischen 41.2 und 52.8 %\n• Es liegt kein signifikanter Unterschied zwischen JA und NEIN vor.", "s": "Teil 1, Folie 25; Teil 2, Folie 16"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Nennen Sie die Beispiele von Schwankungen (Zufallsfehler).", "a": "• 100 Befragte, 50 % ja: d = ±10 % (40 % bis 60 %)\n• 625 Befragte, 50 % ja: d = ±4 % (46 % bis 54 %)\n• 1'000 Befragte, 50 % ja: d = ±3.2 % (46.8 % bis 53.2 %)\n• 1'000 Befragte, 10 % ja: d = ±1.9 % (8.1 % bis 11.9 %)\nBei Mittelwerten wird die Signifikanz mit dem t-Test überprüft.", "s": "Teil 1, Folie 24; Teil 2, Folie 15"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Nennen Sie die Sicherheitsgrade (t) mit ihren Wahrscheinlichkeiten.", "a": "• t1 = 68.3 %\n• t2 = 95.5 % (Standardwert)\n• t3 = 99.7 %\n• t3,29 = 99.9 %\nMind. 95,5 % der einzelnen Fälle entsprechen dem wahren Wert.", "s": "Teil 2, Folie 43"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist ein methodisch korrektes Random-Vorgehen je Befragungsart?", "a": "• Face 2 Face: Jeder 10. Passant, der an einem Standort vorbeiläuft, wird interviewt\n• Online: Aus einem Pool mit Online-Adressen zieht ein Zufallsgenerator die Stichprobe\n• Telefonisch: Telefonnummern numerisch oder alphanumerisch sortiert, jede 20. Nummer wird angerufen\n• Schriftlich: Adressstamm alphabetisch sortiert, jede 20. Adresse wird angeschrieben", "s": "Teil 2, Folie 21; Teil 4, Folie 12"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist der Unterschied zwischen Zufallsauswahl (Random) und bewusster Auswahl (Quota)?", "a": "• Random: Reines Zufallsverfahren. Jedes Element des Universums hat die gleiche Chance, in die Stichprobe zu kommen.\n• Quota: Die Merkmalsquoten werden im Voraus fixiert. Innerhalb der Quoten ist der Interviewer / Rekrutierer frei.", "s": "Teil 2, Folie 18"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Vergleichen Sie Zufallsauswahl und Quotenauswahl (Vorteil, Nachteil, Voraussetzung, typische Anwendung).", "a": "Zufallsauswahl:\n• Vorteil: Vertrauensintervall mathematisch berechenbar\n• Nachteil: oft zu teuer und nicht durchführbar, Fehler bei kleinen Stichproben gross\n• Voraussetzung: alle Elemente des Universums bekannt und ansprechbar\n• Anwendung: Telefoninterviews mit Zufallsauswahl aus allen Telefonnummern\nQuotenauswahl:\n• Vorteil: auch bei kleinen Stichproben sind wichtige Merkmale repräsentativ verteilt\n• Nachteil: Fehler statistisch nicht berechenbar, Verzerrungen während der Befragung leichter möglich\n• Voraussetzung: Verteilung der relevanten Merkmale im Universum bekannt\n• Anwendung: Produkttest mit kleiner Stichprobe, z. B. 30 Kunden", "s": "Teil 5, Folie 13"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was steht hinter dem Quotaverfahren und was ist die Voraussetzung dafür?", "a": "• Hinter der Quotenauswahl steht der Gedanke, dass die Untersuchungsmerkmale repräsentativ abgebildet sind.\n• Voraussetzung: Die Universumstruktur ist bekannt.\n• Beispiel: Universum 2,0 Mio. (80 % Mann / 20 % Frau); Stichprobe n = 1000 → 800 Männer, 200 Frauen, aufgeteilt nach Altersgruppen (Quotenplan).", "s": "Teil 2, Folie 24"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was bedeutet Gewichten und wann wird es angewendet?", "a": "• Entspricht die Quote Ist nicht der Quote Soll, ist die Stichprobe nicht repräsentativ.\n• Massnahme: gewichten = repräsentativ. Jede Zelle wird mit einem Faktor multipliziert (Soll ÷ Ist).\n• Beispiel: 100 Interviews × Faktor 0.8 = 80 (Soll).", "s": "Teil 2, Folie 28"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was versteht man unter dem Universum (Grundgesamtheit)? Nennen Sie Beispiele.", "a": "Als Universum wird die Gesamtheit von Elementen (Personen) definiert, über welche bestimmte Aufschlüsse gewonnen werden sollen.\n• alle Mercedes-Fahrer\n• alle Hundehalter\n• alle Zuschauer einer bestimmten Sendung\n• alle SchweizerInnen im Alter von 15–74 Jahren", "s": "Teil 1, Folie 19; Teil 2, Folie 10"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Wann ist eine Stichprobe repräsentativ?", "a": "• Wenn sie in der Verteilung aller interessierenden Merkmale der Grundgesamtheit entspricht, d. h. ein zwar verkleinertes, aber sonst wirklichkeitsgetreues Abbild darstellt.\n• Die Grösse der Stichprobe hat keinen Einfluss auf die Repräsentativität, sondern nur auf die Genauigkeit.", "s": "Teil 1, Folie 23; Teil 2, Folie 14"}, {"k": "Quantitativ und qualitativ", "q": "Was kennzeichnet die quantitative Marktforschung?", "a": "• Repräsentative Stichprobe\n• Wer, was, wie viel\n• Verhalten, Facts, Rationales\n• Fragebogen: voll- oder halbstrukturiert\n• Reporting: Facts, Tabellen"}, {"k": "Quantitativ und qualitativ", "q": "Was kennzeichnet die qualitative Marktforschung?", "a": "• Nicht repräsentative Stichprobe\n• Frage nach dem Warum (Motivforschung)\n• Irrationales\n• Kein Fragebogen, sondern Gesprächsleitfaden\n• Reporting: Interpretation, Summary"}, {"k": "Quantitativ und qualitativ", "q": "Welche Befragungsarten gibt es bei der quantitativen Marktforschung?", "a": "• Persönlich (Face to Face)\n• Telefonisch\n• Schriftlich (Papier)\n• Online"}, {"k": "Quantitativ und qualitativ", "q": "Welche Befragungsarten gibt es bei der qualitativen Marktforschung?", "a": "• Gruppendiskussion (Fokusgruppen), max. 12 Teilnehmer\n• Einzelexplorationen (Tiefeninterviews), 10 bis max. 50\nModeriert durch Psychologen, Grundlage: Gesprächsleitfaden."}, {"k": "Quantitativ und qualitativ", "q": "Wann wird qualitative Marktforschung oft eingesetzt?", "a": "Als Vorstudie zu einer quantitativen Befragung oder zusätzlich, wenn quantitative Ergebnisse nicht aufschlussreich genug sind."}, {"k": "Quantitativ und qualitativ", "q": "Nennen Sie die Richtkosten der AD-HOC-Forschung.", "a": "Quantitativ:\n• Persönliche Interviews CHF 100.- / Int.\n• Telefonische Interviews CHF 50.- / Int.\n• Schriftliche Interviews CHF 30.- / Int.\n• Online Interviews CHF 30.- / Int.\nQualitativ:\n• Gruppendiskussion (12 Teilnehmer) CHF 10'000 – 15'000.-\n• Einzelexplorationen CHF 750.- bis 1'200.- pro Interview", "s": "Teil 2, Folie 6; Teil 4, Folie 15"}, {"k": "Quantitativ und qualitativ", "q": "Nennen Sie Vor- und Nachteile der persönlichen und der telefonischen Befragung.", "a": "Persönlich:\n• Vorteile: komplexe, erklärungsbedürftige Fragen; Demonstrationsmaterial; Klima des Vertrauens; standardisierte, halbstrukturierte und offene Interviews möglich\n• Nachteile: Interviewer-Bias durch Suggestivfragen; hohe Kosten; hohe Verweigerungsquote\nTelefonisch:\n• Vorteile: schnell; kostengünstiger als persönlich; Auftraggeber kann mithören; geringer Interviewer-Bias; computergestützte Fragebogen; keine Doppelspurigkeit bei der Erfassung\n• Nachteile: keine optischen Informationen; wenig geeignet für heikle Themen", "s": "Teil 5, Folie 8"}, {"k": "Quantitativ und qualitativ", "q": "Nennen Sie Vor- und Nachteile der schriftlichen und der Online-Befragung.", "a": "Schriftlich:\n• Vorteile: kostengünstig; Adressmaterial gut beschaffbar; optische Elemente und Produktmuster möglich\n• Nachteile: häufig niedrige Rücklaufquote; Identität des Befragten nicht klar; nur einfache Fragen und Strukturen; Missverständnisse werden nicht aufgelöst\nOnline:\n• Vorteile: Datensammlung und Aufbereitung sehr schnell (Echtzeit); sehr hohe Interaktivität; automatische Plausibilitätsprüfung\n• Nachteile: technische Barrieren; Verzerrung der Stichprobe", "s": "Teil 5, Folie 8"}, {"k": "Quantitativ und qualitativ", "q": "Worin unterscheiden sich quantitative und qualitative Ad-hoc-Forschung (Stichprobe, Frage, Fragebogen, Reporting)?", "a": "Quantitativ: repräsentative Stichprobe; wer, was, wie viel; Verhalten, Facts, Rationales; Fragebogen voll- oder halbstrukturiert; Reporting: Facts, Tabellen.\nQualitativ: nicht repräsentative Stichprobe; Frage nach dem Motiv; Motivforschung, Irrationales; Gesprächsleitfaden; Reporting: Interpretation, Summary.", "s": "Teil 1, Folie 16; Teil 4, Folie 6"}, {"k": "Fragebogen", "q": "Was sind offene Fragen und was ist ihr Nachteil?", "a": "W-Fragen (wie, wo, wann, wieso, wer …), nicht mit Ja/Nein beantwortbar. Für qualitative Informationen; Auswertung aufwendig und teuer."}, {"k": "Fragebogen", "q": "Welche Typen geschlossener Fragen gibt es?", "a": "• Alternativfragen (zwei, manchmal drei Antwortmöglichkeiten, z. B. Ja-Nein)\n• Mehrfach-Auswahl-Fragen (mehrere Alternativen, nur eine ankreuzbar)\n• Multiple-Choice-Fragen (mehrere Alternativen, mehrere ankreuzbar)\n• Skalafragen (Spezialform der Mehrfach-Auswahl-Fragen)\n• Semantisches Differential (Spezialform der Skalierung)", "s": "Teil 2, Folie 33–37"}, {"k": "Fragebogen", "q": "Welche zwei Formen der Skalierung gibt es?", "a": "• Bipolare Skalierung: +3, +2, +1, 0, −1, −2, −3 (Nullpunkt in der Mitte)\n• Monopolare Skalierung: +3, +2, +1 (nur positiver Bereich)\nSkalafrage = Spezialform der Mehrfach-Auswahl-Fragen; geprüft wird die Intensität einer Aussage.", "s": "Teil 2, Folie 34"}, {"k": "Fragebogen", "q": "Was versteht man unter einem semantischen Differential (Polaritätsfrage)?", "a": "Spezialform der Skalierung. Gegensatzpaare (z. B. hoch–tief, schwach–stark) werden mit einer Skalierung von in der Regel z. B. 1 bis 7 kombiniert. Darstellung als semantisches Profil mit 0.", "s": "Teil 2, Folie 36"}, {"k": "Fragebogen", "q": "Wie ist ein Fragebogen aufgebaut?", "a": "1. Kontakt, Einleitungsfragen (Eisbrecher)\n2. Fragen zur Person\n3. Allgemeine Fragen zum Verhalten (7-W-Fragen)\n4. Bedürfnisse, Einstellung, Motivation, Defizite der Zielgruppe\n5. Programmfragen\n6. Kontrollfragen\nSo lang wie nötig, so kurz wie möglich."}, {"k": "Fragebogen", "q": "Was wird mit den allgemeinen Fragen zum Verhalten (7-W-Fragen) erfragt?", "a": "Wer geht wann, wo, mit wem, wie oft, bei welcher Gelegenheit an welches Konzert?\nAllgemeines Verhalten, nicht das eigene Thema."}, {"k": "Fragebogen", "q": "Was wird im Block Bedürfnisse, Einstellung, Motivation und Defizite gefragt?", "a": "Noch nicht das eigene Thema:\n• Worauf legt die Zielgruppe besonderen Wert? (Bedürfnisse)\n• Grundsätzliche Einstellung zum Thema\n• Was wird besucht/konsumiert und warum? (Motivation)\n• Bestehen Defizite? (Chance)"}, {"k": "Fragebogen", "q": "Was sind Programmfragen?", "a": "Konkrete Fragen zum eigenen Thema:\n• Entspricht es den Bedürfnissen der Zielgruppe?\n• Beurteilung der Idee\n• Was könnte man konkret verbessern?"}, {"k": "Fragebogen", "q": "Was sind Kontrollfragen?", "a": "Gewisse Fragen werden ein zweites Mal, anders formuliert, gestellt."}, {"k": "Fragebogen", "q": "Welche Anforderungen werden an einen Fragebogen gestellt?", "a": "• Fragenformulierung: einfach, klar, eindeutig, präzise, keine Suggestivfragen, keine Überforderung\n• Fragenreihenfolge: keine Beeinflussung, vom Allgemeinen zum Spezifischen, nicht langweilig\n• Fragebogenumfang: zumutbare Länge, Befragungssituation entscheidet\n• Interviewanweisung: klare Filterangaben"}, {"k": "Fragebogen", "q": "Was versteht man unter bipolarer und monopolarer Skalierung?", "a": "Skalafrage = Spezialform der Mehrfach-Auswahl-Fragen; mit einer Skala wird die Intensität einer Aussage geprüft.\n• Bipolare Skalierung: +3, +2, +1, 0, −1, −2, −3 (mit Nullpunkt, positiver und negativer Bereich)\n• Monopolare Skalierung: +3, +2, +1 (nur positiver Bereich)", "s": "Teil 2, Folie 34"}, {"k": "Fragebogen", "q": "Was ist der Unterschied zwischen Alternativfrage, Mehrfach-Auswahl-Frage und Multiple-Choice-Frage?", "a": "• Alternativfrage (z. B. Ja-Nein): zwei, manchmal auch drei Antwortmöglichkeiten («Schmeckt Ihnen Tomatensaft? JA / NEIN / Weder - noch»)\n• Mehrfach-Auswahl-Frage: mehrere Antwortalternativen, es ist aber nur möglich, eine anzukreuzen\n• Multiple-Choice-Frage: mehrere Antwortalternativen, wobei mehrere angekreuzt werden dürfen", "s": "Teil 2, Folie 37"}, {"k": "Fragebogen", "q": "Was sind geschlossene Fragen und welche Eigenschaften haben sie?", "a": "Die Antworten sind grundsätzlich vorgegeben.\n• Werden vor allem bei quantitativen Befragungen angewendet\n• Der Interviewte wird geführt\n• Automatisierte Befragung möglich (Computer aided)\n• Einfachere Auswertung möglich\n• Unterdrücken evtl. andere Antworten", "s": "Teil 2, Folie 33"}, {"k": "Fragebogen", "q": "Was sind offene Fragen und welche Eigenschaften haben sie?", "a": "Der Auskunftsperson wird die Formulierung der Antwort überlassen. Auch W-Fragen genannt (Wie? Was? Wann? mit Wem? Womit?).\n• Werden vor allem im psychoanalytischen Bereich angewandt\n• Erhebungstechnisch aufwendiger, daher kostenintensiver\n• Fordern flexible Interviewer (Leitfaden)\n• Können durch den Interviewer beeinflusst werden", "s": "Teil 2, Folie 35"}, {"k": "Fragebogen", "q": "Was ist eine Suggestivfrage?", "a": "Man stellt eine Frage so, dass die Zustimmung einfacher ist («Es ist doch so…, finden Sie nicht auch?»). Suggestivfragen sollten vermieden werden; sie gehören nicht zu den MAFO-Fragetechniken.", "s": "Teil 2, Folie 38"}, {"k": "Prozess und Briefing", "q": "Welche 6 Phasen hat der Marktforschungsprozess?", "a": "1. Problemformulierungsphase\n2. Checkphase\n3. Designphase\n4. Feldphase (Datengewinnung)\n5. Datenanalyse, Aufbereitung und Interpretation\n6. Dokumentationsphase, Kommunikation"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Problemformulierungsphase?", "a": "«Was will ich wissen?»\n• Untersuchungsziel definieren\n• Untersuchungsgegenstände definieren (z.B. Marktanteile, Logo, Bekanntheitsgrad)"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Checkphase?", "a": "• Bestimmung der Informationsquellen\n• Auswertung von vorhandenem Zahlenmaterial (sekundär)\n• Entscheid zur Durchführung eines Primärforschungsprojektes"}, {"k": "Prozess und Briefing", "q": "Was wird in der Designphase festgelegt?", "a": "• Methode (quantitativ / qualitativ, Befragungsart)\n• Grundgesamtheit\n• Stichprobe, Auswahlverfahren\n• Themenkreis und Programmfragen\n• Budget\n• Entscheid MAFO-Institut\nDas Briefing gehört zur Designphase.", "s": "Teil 4, Folie 16; Teil 1, Folie 14"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Feldphase?", "a": "Feldphase – Datengewinn:\n• Fragebogen erstellen\n• Interviewer-Auswahl\n• Interviewer-Schulung\n• Pilot\n• Feld-Durchführung\nTiming siehe Arbeitsschritte im Briefing.", "s": "Teil 1, Folie 14; Teil 4, Folie 19"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Phase Datenanalyse, Aufbereitung und Interpretation?", "a": "• Datenauswertung und Plausibilisierung\n• Tabellen erstellen\n• Statistische Verfahren (Korrelation, Regression, Zeitreihenanalyse)\n• Grafische Darstellungen\n• Schlussfolgerungen und Empfehlungen"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Dokumentationsphase?", "a": "• Schriftlicher Forschungsbericht\n• Präsentation / Workshop\n• Umsetzung der Ergebnisse"}, {"k": "Prozess und Briefing", "q": "Aus welchen Bausteinen besteht ein Marktforschungsbriefing?", "a": "1. Ausgangslage (Herleitung)\n2. Ziel der Studie (Auftrag)\n3. Themenkreis (allgemeine Fragen, Programmfragen)\n4. Forschungsstrategie (Studiendesign)\n5. Timing\n6. Rahmenbedingungen (Kontrollwünsche, Berichterstattung, Budget)", "s": "Teil 4, Folie 17"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zu den Angaben zum Informationsproblem?", "a": "• Untersuchungsziel «Was wollen wir wissen?»\n• Themenkreis und Programmfragen\n• Arbeitshypothesen"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zur Forschungsstrategie und Forschungstechnik?", "a": "• Methodenwahl inkl. Begründung Wahl / Nichtwahl\n• Grundgesamtheit\n• Vollerhebung oder Stichprobe\n• Stichprobengrösse, tolerierbare Fehlergrösse\n• Auswahlverfahren"}, {"k": "Prozess und Briefing", "q": "Welche Kontrollwünsche können im Briefing stehen?", "a": "Interviewer-Auswahl, Probeinterviews, Einblick in Fragebogen, Rücklaufkontrolle, Anwesenheit bei Testinstruktionen / Gruppendiskussionen"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zur Berichterstattung und zu den Terminen?", "a": "Berichterstattung: schriftlicher Bericht, Grafiken, Präsentation / Workshop, elektronische Datenform.\nTermine: Planung, Pilot, Feldarbeit, Berichterstattung, Projektabschluss."}, {"k": "Prozess und Briefing", "q": "Nach welchen Kriterien beurteilt man eine Marktforschungsofferte?", "a": "• Vollständigkeit\n• Verständnis für die Probleme des Auftraggebers\n• Angepasstheit der Methode\n• Zweckmässigkeit von Organisation und Auswertung\n• Pilot?\n• Interviewer-Briefing im Beisein des Auftraggebers?\n• Stellenwert der Datenqualität\n• Gewicht der Berichterstattung\n• Preis-/Leistungsrelation\n• Bekanntheit / Image des Instituts"}, {"k": "Prozess und Briefing", "q": "Aus welchen 6 Bausteinen besteht das MAFO-Briefing?", "a": "1. Ausgangslage (Herleitung)\n2. Ziel der Studie (Auftrag)\n3. Themenkreis (allgemeine Fragen, Programmfragen – wichtig!)\n4. Forschungsstrategie (Studiendesign): Grundgesamtheit, Voll-/Teilerhebung, Methodenwahl / Nichtwahl, Stichprobe, Auswahlverfahren\n5. Timing\n6. Rahmenbedingungen: Kontrollwünsche, Anforderungen Berichterstattung, Budget", "s": "Teil 4, Folie 17"}, {"k": "Prozess und Briefing", "q": "Nennen Sie die Abschnitte des MAFO-Briefing-Rasters.", "a": "Ausgangslage; Problemformulierung / Erhebungsziel; Programmfragen; Grundgesamtheit (Universum); Erhebungsmethode; Begründung gewählte Methode; Begründung nicht gewählte Methoden; Stichprobengrösse / Auswahlverfahren; Kontrollwünsche; Timing mit Arbeitsschritten; Budget; Berichterstattung; Dokumentation", "s": "Teil 4, Folie 20–21"}, {"k": "Prozess und Briefing", "q": "Welche Arbeitsschritte und welches Timing enthält das Briefing?", "a": "• Auftragserteilung 10 Tage\n• Fragebogen erstellen 10 Tage\n• Pilot durchführen und auswerten 10 Tage\n• Fragebogenanpassung 5 Tage\n• Feldarbeit vorbereiten und durchführen 25 Tage\n• Datenerfassung und Auswertung 10 Tage\n• Berichterstattung 5 Tage", "s": "Teil 4, Folie 19, 21"}, {"k": "Prozess und Briefing", "q": "Was versteht man unter einem Pilot und wo steht er im MAFO-Prozess?", "a": "• Pilot = Testinterviews vor Feldstart (Kontrollwunsch im Briefing: 10–20 Testinterviews)\n• Gehört zur Feldphase\n• Im Timing: «Pilot durchführen und auswerten» 10 Tage, danach Fragebogenanpassung 5 Tage.\nNicht die Rolle des Projektleiters.", "s": "Teil 1, Folie 14; Teil 4, Folie 19"}, {"k": "Prozess und Briefing", "q": "Was wird in der Designphase und was in der Feldphase festgelegt bzw. gemacht?", "a": "Designphase: Methode, Grundgesamtheit, Stichprobe, Auswahlverfahren, Budget, Entscheid MAFO-Institut (Briefing gehört zur Designphase).\nZusätzlich: Befragungsart, Themenkreis und Programmfragen.\nFeldphase – Datengewinn: Fragebogen erstellen, Interviewer-Auswahl, Interviewer-Schulung, Pilot, Feld-Durchführung.", "s": "Teil 4, Folie 16; Teil 1, Folie 14"}, {"k": "Prozess und Briefing", "q": "Wie heissen die Phasen 5 und 6 des MAFO-Prozesses und was passiert dort?", "a": "Phase 5: Datenanalyse, Aufbereitung und Interpretationsphase\nPhase 6: Dokumentations- und Umsetzungsphase\n• Fragebogen auswerten\n• Tabellen und Grafiken erstellen\n• Analyse der Grafiken / Tabellen anhand relevanter Zahlen und Fakten, Fazit ziehen\n• Aus Fazit Erkenntnisse gewinnen, Massnahmen ableiten bzw. umsetzen"}, {"k": "Testarten und Sonderformen", "q": "Welche Testarten gehören zu den 4P des Marketing-Mix?", "a": "• Product: Produktetests\n• Promotion: Werbemitteltests\n• Price: Preisfindungstest\n• Placement: Mystery Shopping"}, {"k": "Testarten und Sonderformen", "q": "Mit welchen Verfahren kann ein Produkt getestet werden?", "a": "• Produkteakzeptanz-Test\n• Geschmackstest\n• Gebrauchs- und Eignungstest\n• Blindtest\n• Konzepttest / «as market»\n• Packungstest\n• Preisgestaltung"}, {"k": "Testarten und Sonderformen", "q": "Wie werden Werbemittel getestet?", "a": "Pretest vor, Posttest nach der Kampagne.\n• Recognition Test = Wiedererkennung\n• Aided Recall = gestützte Bekanntheit\n• Unaided Recall = ungestützte Bekanntheit\n• Werbetracking = wiederkehrende Messung\n• Copytest = gemäss Kriterien der Copyplattform"}, {"k": "Testarten und Sonderformen", "q": "Was ist Mystery Shopping?", "a": "Anonyme Testkäufer überprüfen Servicequalität und Kundenorientierung: Freundlichkeit, Beratungsqualität, Fachkompetenz, Zustand der Verkaufsräume."}, {"k": "Testarten und Sonderformen", "q": "Was ist eine Omnibusbefragung?", "a": "Befragung, an der sich verschiedene Auftraggeber mit einer beschränkten Anzahl Fragen beteiligen.\nMethoden: mündlich, persönlich (z. B. Interbus); schriftlich (z. B. Ecribus); per Telefon (z. B. Telebus, Day-to-Day-Bus).", "s": "Teil 2, Folie 8"}, {"k": "Testarten und Sonderformen", "q": "Was kostet eine Frage im Omnibus bei 1'000 Interviews?", "a": "• Geschlossene Frage CHF 900\n• Skala-Frage CHF 1'200\n• Offene Frage CHF 1'500"}, {"k": "Testarten und Sonderformen", "q": "Welche Vor- und Nachteile hat eine Omnibusbefragung?", "a": "Vorteil: wenige Fragen mit vertretbarem Aufwand.\nNachteil: Themen anderer Auftraggeber können die eigenen Resultate beeinträchtigen."}, {"k": "Testarten und Sonderformen", "q": "Welche weiteren Sonderformen der Marktforschung kennen Sie?", "a": "• PKS – Demoscope: Psychologische Karte der Schweiz\n• MACH Consumer: grösste Schweizer Studie, 11'000 Interviews\n• Link im Auftrag der WEMF: Werbemittelaffinität\n• SINUS Milieu: Segmentation nach psychografischen Merkmalen\n• Euro Sozio Styls – GfK: Lebensstilforschung"}, {"k": "Testarten und Sonderformen", "q": "Was versteht man unter Einzelstudie, Multiclientstudie und Omnibus?", "a": "• Einzelstudie: Studie für einen einzelnen Auftraggeber (Beispiel: Imagestudie BMW)\n• Multiclientstudie: Studie, an der mehrere Auftraggeber beteiligt sind (Beispiel: IDG-Studie «Internet of Things 2019»)\n• Omnibus: Befragung, an der sich verschiedene Auftraggeber mit einer beschränkten Anzahl Fragen beteiligen", "s": "Teil 2, Folie 5, 7, 8"}, {"k": "Testarten und Sonderformen", "q": "Welche Methoden und Vor-/Nachteile hat der Omnibus?", "a": "Methoden:\n• Mündliche, persönliche Befragung (z. B. Interbus)\n• Schriftliche Befragung (z. B. Ecribus)\n• Befragung per Telefon (z. B. Telebus, Day-to-Day-Bus)\nVorteil: Ziele, die nur wenige Fragen erfordern, können relativ kostengünstig erreicht werden.\nNachteil: Ergebnisse zur eigenen Befragung können durch Themen anderer Auftraggeber verzerrt werden.", "s": "Teil 2, Folie 8"}, {"k": "Panelforschung", "q": "Welche zwei Ansätze gibt es in der Panelforschung?", "a": "Detailhandelspanel und Haushaltpanel (Konsumentenpanel)."}, {"k": "Panelforschung", "q": "Was misst das Detailhandelspanel und wer bietet es an?", "a": "Misst die Verkäufe des Detailhandels (Kassen-Scannerdaten).\nFood / Near-Food: Nielsen IQ (Root LU). Non-Food: GfK (seit 2023 zu Nielsen IQ)."}, {"k": "Panelforschung", "q": "Welche Daten liefert das Detailhandelspanel?", "a": "• Marktentwicklung\n• Marktanteile\n• Hitlisten / Topseller\n• Verkäufe des Handels\n• Lagerbestände\n• Distributionswerte (numerisch, gewichtet)\n• Verkaufspreise"}, {"k": "Panelforschung", "q": "Welche Vor- und Nachteile hat das Detailhandelspanel?", "a": "Vorteile: Verkaufssteuerung, Infos über den POS, Konkurrenzinformationen, inkl. Tessin, sehr genaue Abverkaufszahlen, Einkäufe aller Käufergruppen.\nNachteile: es fehlen Kioske und Fachhandel; keine Informationen über Käufer."}, {"k": "Panelforschung", "q": "Welche Kanäle sind im Nielsen-Food/Nearfood-Panel nicht abgedeckt?", "a": "• Discounter (Aldi, Lidl)\n• HOREKA (Cash & Carry)\n• Tankstellen / Kioske\n• Spezialgeschäfte"}, {"k": "Panelforschung", "q": "Wie funktioniert das Haushaltpanel?", "a": "3'000 repräsentative Haushalte (D- und F-CH), Handscanner, Kassenbon oder EAN. Ungenauer als das Detailhandelspanel, aber Käuferanalysen möglich. Für Non-Food gibt es in der Schweiz keines."}, {"k": "Panelforschung", "q": "Welche Daten liefert das Haushaltpanel?", "a": "• Marktentwicklung und Marktanteile\n• Durchschnittspreise\n• Verteileranteile (Coop, Migros, Denner, Aldi, Lidl)\n• Käuferstruktur\n• Einkaufsmenge pro Haushalt\n• Wiederkaufsraten\n• Käuferwanderungen"}, {"k": "Panelforschung", "q": "Welche Vor- und Nachteile hat das Haushaltspanel?", "a": "Vorteile: erfasst alle Produkte des täglichen Bedarfs; Konsumentendaten; alle Verteilerkanäle erfasst; Analysen über Käufer und Verhalten; Informationen über Haushaltstruktur.\nNachteile: nur Einkauf privater, assimilierter Haushaltungen in der Schweiz; keine Lagerdaten; Impuls- und Ausser-Haus-Konsum-Käufe nicht erfasst; Kanton Tessin nicht abgedeckt; Verzerrung bei «heiklen» Categorys (Alkohol, Zigaretten, Schokolade, Baby-Artikel); keine Distributionskennzahlen.", "s": "Teil 3, Folie 8"}, {"k": "Panelforschung", "q": "Was versteht man unter Marktkapazität und Marktpotenzial?", "a": "• Marktkapazität = Anschaffung / Bedürfnis ohne Berücksichtigung der Kaufkraft (Quantitative Ad-Hoc Forschung)\n• Marktpotenzial = konkrete Kaufabsicht (Quantitative Ad-Hoc Forschung)\nBeispiel Airfryer: 4.0 Mio. Haushalte; Marktpotenzial 1.6 Mio.", "s": "Unterricht 06.05.2026, Folie 1"}, {"k": "Panelforschung", "q": "Was versteht man unter Marktvolumen, Marktanteil, Sättigungsgrad und Penetration?", "a": "• Marktvolumen (Beispiel: 800'000) → Panelforschung\n• Marktanteil → Panelforschung\n• Sättigungsgrad: Marktvolumen im Verhältnis zum Marktpotenzial (Beispiel: 50 %)\n• Penetration (Beispiel: 20 %; 800'000 von 4.0 Mio. Haushalten)\nDie Rechnungen 800'000 ÷ 1.6 Mio. bzw. ÷ 4.0 Mio.", "s": "Unterricht 06.05.2026, Folie 1"}, {"k": "Panelforschung", "q": "Welche Marktkennzahlen stammen aus der Ad-hoc-Forschung, welche aus der Panelforschung?", "a": "• Quantitative Ad-Hoc Forschung: Marktkapazität, Marktpotenzial\n• Panelforschung: Marktvolumen, Marktanteil", "s": "Unterricht 06.05.2026, Folie 1"}, {"k": "Panelforschung", "q": "Was ist der Unterschied zwischen numerischer (ungewichteter) und gewichteter Distribution?", "a": "• Numerische Distribution: bezieht sich auf die Anzahl POS (Verkaufsstellen)\n• Gewichtete Distribution: bezieht sich auf das Marktvolumen\n• Beide Werte stammen aus dem Detailhandelspanel.\n• Beispiel Teil 3: 5000 POS, 2500 (50 %) numerisch; gewichtet 30 % bei einem Marktvolumen von 2.0 Mia. CHF.", "s": "Teil 3, Folie 6–7; Unterricht 06.05.2026, Folie 2"}, {"k": "Panelforschung", "q": "Was sagt der Distributionsfaktor aus?", "a": "• Distributionsfaktor = gewichtete Distribution ÷ numerische Distribution\n• Alles über 1.0: Marke ist in umsatzstarken Shops\n• Alles unter 1.0: Marke ist in umsatzschwächeren Läden", "s": "Unterricht 06.05.2026, Folie 2"}, {"k": "Panelforschung", "q": "Was versteht man unter Panel Coverage?", "a": "• Detailhandels- und Konsumentenpanel erfassen nie den gesamten Markt.\n• Der geschätzte Gesamtmarkt wird dem erhobenen Volumen (Panelmarkt) gegenübergestellt; daraus ergibt sich die Abdeckung des Panelmarktes.\n• Panelabdeckung = Coverage\n• Beispiel: Gesamtmarkt Kaffee CHF 500 Mio., Panelmarkt CHF 250 Mio. → Coverage 50 %.", "s": "Teil 3, Folie 11"}, {"k": "Panelforschung", "q": "Was versteht man unter dem Paneleffekt?", "a": "Alle bewussten und unbewussten Veränderungen im Verhalten der Panelteilnehmer, die sich durch die laufende Wiederholung der Erhebung ergeben.", "s": "Teil 3, Folie 10"}, {"k": "Panelforschung", "q": "Was versteht man unter Panel-Mortalität und was sind die Ursachen?", "a": "Ausmass der Teilnehmer, die während der Forschungsphase ungeplant ausscheiden. Führt zu einem systematischen Fehler; in der Regel Ersatz durch strukturgleiche neue Teilnehmer.\nUrsachen:\n• Teilnehmer verliert Lust / Motivation\n• Teilnehmer erkrankt oder verstirbt\n• Teilnehmer zieht um\n• Lebensumstände ändern sich, er passt nicht mehr ins Thema (z. B. Raucher gibt das Rauchen auf)", "s": "Teil 3, Folie 10"}, {"k": "Panelforschung", "q": "Wo liegen Detailhandelspanel und Haushaltspanel in der Absatzkette und wer liefert die Daten?", "a": "• Detailhandelspanel: zwischen Absatzmittler und Produktverwender; Food / Nearfood: NIQ, Nonfood: GfK\n• Haushaltspanel: Produktverwender (Käufer); Food / Nearfood: NIQ", "s": "Teil 5, Folie 24; Teil 3, Folie 3"}, {"k": "Panelforschung", "q": "Welche Daten liefern nur das Handelspanel, nur das Haushaltspanel, welche beide?", "a": "• Nur Handelspanel: handelsspezifische Daten, z. B. zu Lagerhaltung, Verkaufsförderungsmassnahmen\n• Beide Panels: Marktvolumen und -anteile (mengen- und wertmässig), durchschnittlich bezahlte, effektive Preise, Kaufort\n• Nur Haushaltspanel: konsumspezifische Daten, z. B. Kaufverhalten bestimmter Gruppen von Haushalten, Käufer-/Neukäuferanalyse", "s": "Teil 3, Folie 4"}, {"k": "Panelforschung", "q": "Welche Einkaufsstätten decken Handelspanel und Haushaltspanel (Verbraucherpanel) ab?", "a": "• Handelspanel: berichtet die Geschäfte des Handelspanelsegments (z. B. Migros, Coop, Denner, Volg, Spar, Manor, Globus); andere Geschäfte (z. B. Aldi, Lidl) sind nicht berichtet.\n• Haushaltspanel: berichtet das Handelspanelsegment und zusätzlich andere Geschäfte wie Aldi und Lidl; nicht berichtet sind Tourist, Horeka (ausser Haus) und das Tessin.\n• Das integrierte Panel kombiniert beide Sichten.", "s": "Teil 3, Folie 5, Folie 8"}, {"k": "Panelforschung", "q": "Erklären Sie die Panel Coverage am Beispiel mit Gesamtmarkt 1200 und Panelmarkt 400 Mio.", "a": "• Coverage / Abdeckung = Anteil des Gesamtmarktes, den das Panel abdeckt (Panelmarkt im Verhältnis zum Gesamtmarkt).\n• Das Ergebnis ist offen gelassen («xy %»); rechnerisch 400 ÷ 1200 = 33.3 %.\n• Nespresso (350 Mio.) liegt innerhalb des Gesamtmarktes, aber ausserhalb des Panelmarktes: Umsatz, der im Panel nicht erfasst ist.", "s": "Teil 3, Folie 11; Teil 5, Folie 25"}, {"k": "Institute und Datenschutz", "q": "Welche Marktforschungsinstitute sind international und national bedeutend?", "a": "International: Nielsen IQ, GfK, IPSOS (TNS, NPD nicht in CH).\nNational: LINK (Luzern), DemoSCOPE (Adligenswil), GfS (Bern), ISO Public (Schwerzenbach)."}, {"k": "Institute und Datenschutz", "q": "Wer ist der EDÖB und welche Aufgaben hat er?", "a": "Eidg. Datenschutz- und Öffentlichkeitsbeauftragter, Sitz Bern. Berät Private, beaufsichtigt Private und Bundesorgane, erstattet dem Bundesrat Bericht zum Öffentlichkeitsgesetz."}, {"k": "Institute und Datenschutz", "q": "Wo ist der Datenschutz in der Schweiz geregelt?", "a": "Bundesgesetz für Bundesbehörden und Private. Kantonale Behörden: kantonale Gesetze."}, {"k": "Institute und Datenschutz", "q": "Was bedeutet die Informationspflicht?", "a": "In der Schweiz gilt neben der Auskunftspflicht auch die Informationspflicht: Betroffene müssen unaufgefordert informiert werden."}, {"k": "Institute und Datenschutz", "q": "Was ist beim Datenschutz bei Umfragen zu beachten?", "a": "Der Auftraggeber darf nicht den kompletten Adressbestand an das durchführende Unternehmen weitergeben."}, {"k": "Institute und Datenschutz", "q": "Ist Adresshandel in der Schweiz erlaubt?", "a": "Nicht verboten, aber enge Grenzen. Adresse kann für Werbezwecke gesperrt werden."}, {"k": "Institute und Datenschutz", "q": "Was gilt bei der Datenübermittlung ins Ausland?", "a": "Daten müssen ausreichend geschützt sein (Art. 7 DSG): Integrität, Vertraulichkeit und Verfügbarkeit sichern."}];
