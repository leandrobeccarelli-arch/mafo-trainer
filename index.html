e.", "s": "Unterricht 06.05.2026, Folie 6"}, {"k": "Analyse-Tools", "q": "In der BCG-Matrix steht der relative Marktanteil auf der x-Achse.", "t": true, "e": "x-Achse: relativer Marktanteil; y-Achse: Marktwachstum in %.", "s": "Analyse Schema TOOLS, Folie 15, 19"}, {"k": "Analyse-Tools", "q": "Question Marks haben einen hohen Marktanteil.", "t": false, "e": "Question Marks: niedriger Marktanteil, hoher Aufwand, keine Rendite; Entscheidung ob investieren oder eliminieren.", "s": "Analyse Schema TOOLS, Folie 19"}, {"k": "Analyse-Tools", "q": "Cash Cows haben einen hohen Cash-Flow und finanzieren andere Geschäftsfelder.", "t": true, "e": "Cash Cows: hoher Marktanteil, finanzieren andere Geschäftsfelder, hoher Cash-Flow, abschöpfen.", "s": "Analyse Schema TOOLS, Folie 19"}, {"k": "Analyse-Tools", "q": "Die McKinsey-Matrix hat die Achsen Marktattraktivität und relative Wettbewerbsstärke.", "t": true, "e": "Y: Marktattraktivität, X: Rel. Wettbewerbsstärke; 9 Felder.", "s": "Analyse Schema TOOLS, Folie 18"}, {"k": "Analyse-Tools", "q": "Im Nutzwertanalyse-Beispiel entspricht der gewichtete Wert dem Produkt aus Gewichtung und ungewichteter Bewertung.", "t": true, "e": "Beispiel Reformhaus: 5 × 2 = 10, 15 × 4 = 60, 25 × 2 = 50 (Rechenregel aus den Zahlen abgeleitet).", "s": "Analyse Schema TOOLS, Folie 21"}, {"k": "Analyse-Tools", "q": "Das Anforderungsprofil-Beispiel enthält nur Muss-Kriterien.", "t": false, "e": "Es gibt Spalten Muss und Kann (z. B. Follower-Zahl grösser 50'000 = Kann).", "s": "Analyse Schema TOOLS, Folie 22"}, {"k": "Analyse-Tools", "q": "Die Risikomatrix hat die Achsen Auswirkungen und Eintrittswahrscheinlichkeit.", "t": true, "e": "Auswirkungen: Gross / Mittel / Klein; Eintrittswahrscheinlichkeit: Gering bis Beinahe sicher.", "s": "Analyse Schema TOOLS, Folie 23"}, {"k": "Analyse-Tools", "q": "Im Szenariotrichter liegt das Worst-Case-Szenario am unteren Rand.", "t": true, "e": "Oben Best-Case, Mitte Trendszenario, unten Worst-Case.", "s": "Analyse Schema TOOLS, Folie 28"}, {"k": "Analyse-Tools", "q": "Im Produktlebenszyklus erreicht der Gewinn seinen Höhepunkt vor dem Umsatzmaximum.", "t": true, "e": "Gewinnmaximum zu Beginn der Reife, Umsatzmaximum in der Reife (aus der Grafik abgelesen).", "s": "Teil 3, Folie 62"}, {"k": "Analyse-Tools", "q": "Das Porter-5-Forces-Modell stellt «Rivalry among existing competitors» ins Zentrum.", "t": true, "e": "Die vier übrigen Kräfte zeigen mit Pfeilen auf die Rivalität unter bestehenden Wettbewerbern.", "s": "Analyse Schema TOOLS, Folie 11"}, {"k": "Analyse-Tools", "q": "Im Marktsystem-Beispiel Fleischersatz hat Ensoy einen Marktanteil von 3.2 % am Tofu-Markt und 0.6 % am Fleischersatzmarkt.", "t": true, "e": "Marktanteil Ensoy an Tofu 2020 = 3.2 %, am Fleischersatzmarkt = 0.6 %.", "s": "Analyse Schema TOOLS, Folie 10"}, {"k": "Sekundär und Primär", "q": "AD-HOC-Studien sind eine Momentaufnahme.", "t": true, "e": "Die Panelforschung gleicht dagegen einem Film."}, {"k": "Sekundär und Primär", "q": "Sekundärforschung nennt man auch Field Research.", "t": false, "e": "Sekundär = Desk Research. Field Research = primäre AD-HOC-Forschung."}, {"k": "Sekundär und Primär", "q": "Bei der Panelforschung wechselt die Stichprobe jedes Mal.", "t": false, "e": "Gleichbleibende, repräsentative Stichprobe."}, {"k": "Sekundär und Primär", "q": "Bei der biotischen Beobachtung weiss der Proband nicht Bescheid, dass er beobachtet wird.", "t": true, "e": "Es findet keine Befragung statt.", "s": "Teil 1, Folie 17"}, {"k": "Sekundär und Primär", "q": "Bei der unbiotischen Beobachtung findet keine Befragung statt.", "t": false, "e": "Das ist biotisch; unbiotisch: Befragung findet statt, eher quantitativ.", "s": "Teil 1, Folie 17"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Je mehr Personen befragt werden, desto repräsentativer ist das Ergebnis.", "t": false, "e": "Die Stichprobengrösse beeinflusst nur die Genauigkeit, nicht die Repräsentativität."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei der Zufallsauswahl ist das Vertrauensintervall mathematisch berechenbar.", "t": true, "e": "Das ist der Vorteil der Zufallsauswahl. Nachteil: oft zu teuer und nicht durchführbar, bei kleinen Stichproben ist der Fehler gross.", "s": "Teil 5, Folie 13"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Die Genauigkeit einer Stichprobe hängt von der Grösse des Universums ab.", "t": false, "e": "1'000 Befragte sind bei 8 Mio. gleich genau wie bei 4'000."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Das Quota-Verfahren setzt voraus, dass die Struktur der Grundgesamtheit bekannt ist.", "t": true, "e": "Nur dann können Quoten vorgegeben werden."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei der willkürlichen Auswahl entscheidet der Interviewer, wen er befragt.", "t": true, "e": "Billigstes, aber am wenigsten repräsentatives Verfahren."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Zufallsfehler entstehen durch Fehlleistungen der beteiligten Personen.", "t": false, "e": "Das sind systematische Fehler. Zufallsfehler entstehen durch die Stichprobe."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Die Vollerhebung ist der Normalfall der Marktforschung.", "t": false, "e": "Sie kann nur selten angewandt werden; meistens Teilerhebung."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Der Zufallsfehler wird berechnet, nachdem die Befragung stattgefunden hat.", "t": true, "e": "Berechnung nach der Befragung.", "s": "Teil 2, Folie 49"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei 1'000 Befragten und 50 % Ja beträgt die Schwankung d = ±3.2 %.", "t": true, "e": "46.8 % bis 53.2 %.", "s": "Teil 1, Folie 24"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei 625 Befragten und 50 % Ja beträgt die Schwankung d = ±10 %.", "t": false, "e": "±10 % gilt bei 100 Befragten; bei 625 sind es ±4 %.", "s": "Teil 1, Folie 24"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei 53 % Ja und 47 % Nein (Basis 300 Interviews) besteht ein signifikanter Unterschied.", "t": false, "e": "d = ±5.76; die Bereiche überlappen, kein signifikanter Unterschied.", "s": "Teil 1, Folie 25"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Der Sicherheitsgrad t2 entspricht 99.7 %.", "t": false, "e": "t2 = 95.5 %; 99.7 % ist t3.", "s": "Teil 2, Folie 43"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Der Sicherheitsgrad t1 beträgt 68.3 %.", "t": true, "e": "t1 = 68.3 %.", "s": "Teil 2, Folie 43"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei Mittelwerten werden die Signifikanzen mit dem t-Test überprüft.", "t": true, "e": "Anderes statistisches Verfahren als bei Anteilswerten.", "s": "Teil 1, Folie 24"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Beim Random-Verfahren hat jedes Element des Universums die gleiche Chance, in die Stichprobe zu kommen.", "t": true, "e": "Reines Zufallsverfahren.", "s": "Teil 2, Folie 18"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Beim Quotaverfahren ist der Interviewer innerhalb der Quoten frei.", "t": true, "e": "Die Merkmalsquoten werden im Voraus fixiert.", "s": "Teil 2, Folie 18"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Beim Quotaverfahren ist der Fehler statistisch berechenbar.", "t": false, "e": "Das gilt für die Zufallsauswahl; bei Quota ist der Fehler statistisch nicht berechenbar.", "s": "Teil 5, Folie 13"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei Face-2-Face-Befragungen entspricht es dem Random-Vorgehen, jeden 10. Passanten an einem Standort zu interviewen.", "t": true, "e": "Methodisch korrektes Vorgehen.", "s": "Teil 2, Folie 21"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Bei Online-Befragungen wählt der Interviewer die Personen aus dem Adresspool nach Gutdünken aus.", "t": false, "e": "Ein Zufallsgenerator zieht die Stichprobe aus dem Pool.", "s": "Teil 2, Folie 21"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Gewichten bedeutet, dass die Ist-Quoten mit einem Faktor multipliziert werden, damit die Stichprobe repräsentativ wird.", "t": true, "e": "Beispiel: 100 Interviews × Faktor 0.8.", "s": "Teil 2, Folie 28"}, {"k": "Quantitativ und qualitativ", "q": "Qualitative Marktforschung arbeitet mit einer repräsentativen Stichprobe.", "t": false, "e": "Nicht repräsentativ; es geht um das Warum."}, {"k": "Quantitativ und qualitativ", "q": "Qualitative Forschung wird oft als Vorstudie zu einer quantitativen Befragung durchgeführt.", "t": true, "e": "Oder zusätzlich, wenn quantitative Ergebnisse nicht aufschlussreich genug sind."}, {"k": "Quantitativ und qualitativ", "q": "Eine Gruppendiskussion hat maximal 12 Teilnehmer.", "t": true, "e": "Auch Fokusgruppe genannt."}, {"k": "Quantitativ und qualitativ", "q": "Bei quantitativer Forschung wird ein Gesprächsleitfaden statt eines Fragebogens verwendet.", "t": false, "e": "Gesprächsleitfaden = qualitativ. Quantitativ: voll- oder halbstrukturierter Fragebogen."}, {"k": "Quantitativ und qualitativ", "q": "Persönliche Interviews kosten laut Richtkosten CHF 30.- pro Interview.", "t": false, "e": "CHF 100.-; CHF 30.- gilt für schriftliche und Online-Interviews.", "s": "Teil 2, Folie 6"}, {"k": "Quantitativ und qualitativ", "q": "Bei der schriftlichen Befragung ist die Identität des Befragten nicht klar.", "t": true, "e": "Nachteil der schriftlichen Befragung.", "s": "Teil 5, Folie 8"}, {"k": "Fragebogen", "q": "Offene Fragen können mit Ja oder Nein beantwortet werden.", "t": false, "e": "Offene Fragen sind W-Fragen."}, {"k": "Fragebogen", "q": "Die bipolare Skalierung hat einen Nullpunkt in der Mitte.", "t": true, "e": "+3 bis −3 mit 0.", "s": "Teil 2, Folie 34"}, {"k": "Fragebogen", "q": "Programmfragen betreffen das eigene Thema.", "t": true, "e": "Davor kommen allgemeine Fragen zu Verhalten und Bedürfnissen."}, {"k": "Fragebogen", "q": "Ein Fragebogen beginnt mit dem Spezifischen und endet mit dem Allgemeinen.", "t": false, "e": "Umgekehrt: mit dem Allgemeinen beginnen (Trichter)."}, {"k": "Fragebogen", "q": "Bei Multiple-Choice-Fragen darf nur eine Antwort angekreuzt werden.", "t": false, "e": "Bei Multiple-Choice dürfen mehrere angekreuzt werden; bei Mehrfach-Auswahl nur eine.", "s": "Teil 2, Folie 37"}, {"k": "Fragebogen", "q": "Suggestivfragen sollten vermieden werden.", "t": true, "e": "Sie gehören nicht zu den MAFO-Fragetechniken.", "s": "Teil 2, Folie 38"}, {"k": "Prozess und Briefing", "q": "Der Pilot findet in der Designphase statt.", "t": false, "e": "In der Feldphase."}, {"k": "Prozess und Briefing", "q": "In der Checkphase wird das Budget bestimmt.", "t": false, "e": "In der Designphase."}, {"k": "Prozess und Briefing", "q": "Die günstigste Offerte ist immer die beste.", "t": false, "e": "Nicht immer; mehrere Kriterien vergleichen."}, {"k": "Prozess und Briefing", "q": "Im Briefing wird die Methodenwahl inklusive Begründung von Wahl und Nichtwahl festgehalten.", "t": true, "e": "Baustein 4: Forschungsstrategie (Studiendesign).", "s": "Teil 4, Folie 17, 20"}, {"k": "Prozess und Briefing", "q": "Die Designphase enthält auch das Budget.", "t": true, "e": "Methode, Grundgesamtheit, Stichprobe, Auswahlverfahren, Budget, Entscheid MAFO-Institut.", "s": "Teil 4, Folie 16"}, {"k": "Prozess und Briefing", "q": "Der Fragebogen wird in der Designphase erstellt.", "t": false, "e": "In der Feldphase.", "s": "Teil 1, Folie 14"}, {"k": "Testarten und Sonderformen", "q": "Im Omnibus beteiligen sich mehrere Auftraggeber mit wenigen Fragen.", "t": true, "e": "Mehrthemenumfrage."}, {"k": "Testarten und Sonderformen", "q": "Aided Recall misst die ungestützte Bekanntheit.", "t": false, "e": "Aided = gestützt, Unaided = ungestützt."}, {"k": "Testarten und Sonderformen", "q": "Werbemittel werden vor der Kampagne mit einem Pretest gemessen.", "t": true, "e": "Danach mit einem Posttest."}, {"k": "Testarten und Sonderformen", "q": "Der Telebus ist eine Omnibus-Befragung per Telefon.", "t": true, "e": "Ebenso der Day-to-Day-Bus.", "s": "Teil 2, Folie 8"}, {"k": "Panelforschung", "q": "Das Haushaltpanel deckt den Kanton Tessin ab.", "t": false, "e": "Tessin ist nicht ab iner pflanzlichen Joghurt-Linie. Relevante Fakten: (1) USP: 100 % Bergmilch aus Graubünden, Bio-Label; die gestützte Markenbekanntheit bei Bio-Käufern liegt bei 62 %. (2) Vertrieb heute nur über Bioläden und den Detailhandel, kein eigener Online-Vertrieb. (3) Die Produktion ist zu 95 % ausgelastet; mit pflanzlichen Rohstoffen hat das Unternehmen keine Erfahrung. (4) Der Schweizer Markt für pflanzliche Joghurt-Alternativen beträgt CHF 85 Mio. und wächst im Schnitt um 12 % pro Jahr; der Anteil Flexitarier nimmt zu. (5) Grossverteiler bauen ihre Eigenmarken im Bio- und Pflanzenbereich aus, was den Preisdruck erhöht. Aufgabe: Analysieren Sie die Ausgangslage mit der SWOT-Analyse.", "s": "Analyse Schema TOOLS, Folie 14, 16, 17; Unterricht 06.05.2026, Folie 4, 5", "parts": [{"q": "Erstellen Sie die SWOT-Analyse (Stärken, Schwächen, Chancen, Gefahren mit relevanten Fakten).", "sol": ["Stärken (intern): USP 100 % Bergmilch aus Graubünden mit Bio-Label; gestützte Markenbekanntheit bei Bio-Käufern 62 %", "Schwächen (intern): Produktion zu 95 % ausgelastet; keine Erfahrung mit pflanzlichen Rohstoffen; kein eigener Online-Vertrieb", "Chancen (extern): Markt für pflanzliche Joghurt-Alternativen CHF 85 Mio. mit ø +12 % pro Jahr; Anteil Flexitarier nimmt zu", "Gefahren (extern): Grossverteiler bauen Eigenmarken im Bio- und Pflanzenbereich aus, der Preisdruck steigt"], "max": 8}, {"q": "Formulieren Sie das Fazit: «Marktfähig weil…» und «Marktattraktiv weil…».", "sol": ["Marktfähig (Stärken / Schwächen): Ja, mit Einschränkung, weil der USP und die Bekanntheit bei Bio-Käufern stark sind, die Auslastung von 95 % und das fehlende Know-how mit pflanzlichen Rohstoffen aber Schwächen sind", "Marktattraktiv (Chancen / Gefahren): Ja, weil der Markt CHF 85 Mio. gross ist und um ø 12 % pro Jahr wächst; der Preisdruck durch Eigenmarken der Grossverteiler mindert die Attraktivität"], "max": 4}, {"q": "Leiten Sie in der SWOT-Matrix je eine Strategie ab (SO, WO, ST, WT).", "sol": ["SO «Ausbauen»:  hoch)", "Klassisches Birchermüesli: Cash Cow (Marktwachstum niedrig, relativer Marktanteil hoch)", "Veganer Snack-Becher: Question Mark (Marktwachstum hoch, relativer Marktanteil niedrig)", "Zwieback: Poor Dog / Dog (Marktwachstum niedrig, relativer Marktanteil niedrig)"], "max": 8, "note": "Die Einordnung erfolgt über hoch / niedrig."}, {"q": "Nennen Sie je Feld die Merkmale und die sich daraus ergebende Empfehlung.", "sol": ["Stars: schnelles Wachstum, erzielen Gewinne, benötigen weitere Investitionen, müssen ausgebaut werden", "Cash Cow: hoher Marktanteil, finanziert andere Geschäftsfelder, hoher Cash-Flow, abschöpfen", "Question Mark: hoher Aufwand, niedriger Marktanteil, keine Rendite; Entscheidung, ob investieren oder eliminieren", "Dog: erwirtschaftet keine Gewinne mehr, geringes Marktwachstum, evtl. Marktschwund, evtl. Desinvestition"], "max": 8}, {"q": "Formulieren Sie Erkenntnis (Chancen / Potenziale), Empfehlung und Begründung (Was bringt die Massnahme konkret?).", "sol": ["Erkenntnis / Potenziale: Der Riegel hat Potenzial im wachsenden Markt; der Snack-Becher wächst stark, hat aber noch einen niedrigen relativen Marktanteil", "Empfehlung: Riegel ausbauen (weitere Investitionen), Birchermüesli abschöpfen, Zwieback evtl. desinvestieren, beim Snack-Becher entscheiden: investieren oder eliminieren", "Begründung: Der Cash-Flow aus dem Birchermüesli finanziert den Ausbau des Riegels (Cash Cows finanzieren andere Geschäftsfelder); Mittel werden aus dem Zwieback ohne Gewinne abgezogen und auf wachstumsstarke Produkte konzentriert"], "max": 6, "note": "Schema: Fakten, Erkenntnis, Empfehlung und Begründung."}]}];

const P1=x=>N(x,1);
function genPanel(){const y=2025,cat=pk(PANELCAT),S=["bis CHF 400","CHF 400 bis 700","CHF 700 bis 1'000","über CHF 1'000"];let o;
for(;;){const tr=pk([-1,1]),v0=ri(180,620)/10,v1=rd(v0*(1+tr*ri(10,30)/1000),1),v2=rd(v1*(1+tr*ri(10,40)/1000),1);
const s4=ri(220,270)/10,s1=ri(180,220)/10,s2=ri(260,300)/10,s3=rd(100-s1-s2-s4,1),s40=rd(s4-ri(25,45)/10,1),k=(100-s40)/(100-s4),s10=rd(s1*k,1),s20=rd(s2*k,1),s30=rd(100-s10-s20-s40,1);
const m=[ri(150,200)/10,ri(260,300)/10,ri(215,250)/10,0],m0=[rd(m[0]-ri(10,25)/10,1),rd(m[1]-ri(25,40)/10,1),rd(m[2]-ri(20,35)/10,1),ri(150,175)/10];m[3]=rd(m0[3]-ri(45,65)/10,1);
const sh2=[s1,s2,s3,s4],sh0=[s10,s20,s30,s40],a2=rd(sh2.reduce((t,x,i)=>t+x*m[i],0)/100,1),a0=rd(sh0.reduce((t,x,i)=>t+x*m0[i],0)/100,1);
const b2=rd(a2-ri(40,60)/10,1),b0=rd(b2+ri(8,18)/10,1),c0=ri(28,45)/10,c2=rd(c0+ri(55,85)/10,1),d0=ri(70,90)/10,d2=rd(d0+ri(8,18)/10,1),e0=ri(110,130)/10,e2=rd(e0-ri(40,60)/10,1);
const on0=ri(330,390)/10,on1=rd(on0+ri(25,45)/10,1),on2=rd(on1+ri(2,12)/10,1);
const mid=(a,b)=>rd((a+b)/2+ri(-3,3)/10,1);
if(a2<=a0+.3||b0>=a0||c2>=b2||d2>=b2||e2>=b2)continue;
o={tr,v:[v0,v1,v2],sh0,sh2,m0,m,A:[a0,mid(a0,a2),a2],B:[b0,mid(b0,b2),b2],C:[c0,mid(c0,c2),c2],D:[d0,mid(d0,d2),d2],E:[e0,mid(e0,e2),e2],on:[on0,on1,on2]};break}
const Y=[y-2,y-1,y],rest=i=>rd(100-o.A[i]-o.B[i]-o.C[i]-o.D[i]-o.E[i],1),pv0=o.v[0]*o.sh0[3]/100,pv2=o.v[2]*o.sh2[3]/100,z=Math.round(o.A[2]),mehr=pv2*(z-o.m[3])/100,best3=o.m.indexOf(Math.max(...o.m));
const dv=(o.v[2]/o.v[0]-1)*100;
return{again:"Neue Zahlen",s:"Grundlagentest 2026, Aufgabe 4",
intro:`Sie arbeiten für die Marke Alva. Die Paneldaten zeigen den Schweizer Markt für ${cat} über die letzten 3 Jahre. Alva prüft die Einführung einer Premium-Linie über CHF 1'000.`,
tb:[{cap:"Tabelle 1 · Marktvolumen in Mio. CHF (Panelmarkt)",h:["",...Y],r:[[cat,...o.v.map(P1)]]},
{cap:"Tabelle 2 · Marktanteile in % (Wert)",h:["Marke",...Y],r:[["Alva",...o.A.map(P1)],["Brento",...o.B.map(P1)],["Coro",...o.C.map(P1)],["Dexa",...o.D.map(P1)],["Elvo",...o.E.map(P1)],["Übrige",...[0,1,2].map(i=>P1(rest(i)))]]},
{cap:"Tabelle 3 · Umsatzanteil nach Kanal in %",h:["Kanal",...Y],r:[["Stationär",...o.on.map(x=>P1(100-x))],["Online",...o.on.map(P1)]]},
{cap:"Tabelle 4 · Preisklassen",h:["Preisklasse",`Anteil am Markt ${y-2}`,`Anteil am Markt ${y}`,`Marktanteil Alva ${y-2}`,`Marktanteil Alva ${y}`],r:S.map((n,i)=>[n,P1(o.sh0[i])+" %",P1(o.sh2[i])+" %",P1(o.m0[i])+" %",P1(o.m[i])+" %"])}],
parts:[{q:"a) Erfassen Sie die relevanten Fakten aus Sicht von Alva.",hint:"Pro Tabelle die wichtigsten Zahlen nennen. 6 Fakten genügen.",max:6,sol:[
`Tabelle 1: Das Marktvolumen entwickelt sich ${o.tr>0?"positiv":"negativ"}, von CHF ${P1(o.v[0])} Mio. (${y-2}) auf CHF ${P1(o.v[2])} Mio. (${y}), das sind ${dv>0?"+":"−"}${P1(Math.abs(dv))} %.`,
`Tabelle 2: Alva ist mit ${P1(o.A[2])} % Marktleader und hat in 3 Jahren ${P1(o.A[2]-o.A[0])} Prozentpunkte gewonnen.`,
`Tabelle 2: Brento ist die Nummer 2, der Marktanteil sinkt von ${P1(o.B[0])} % auf ${P1(o.B[2])} %.`,
`Tabelle 2: Gewinner ist Coro mit einem Anstieg von ${P1(o.C[0])} % auf ${P1(o.C[2])} %. Elvo verliert von ${P1(o.E[0])} % auf ${P1(o.E[2])} %.`,
`Tabelle 3: Die Nachfrage verlagert sich online. Der Online-Anteil steigt von ${P1(o.on[0])} % auf ${P1(o.on[2])} %, stationär sind es noch ${P1(100-o.on[2])} %.`,
`Tabelle 4: Die Preisklasse über CHF 1'000 macht ${P1(o.sh2[3])} % des Marktes aus. Der Teilmarkt wächst von CHF ${P1(pv0)} Mio. auf CHF ${P1(pv2)} Mio.`,
`Tabelle 4: Alva verliert über CHF 1'000 deutlich, von ${P1(o.m0[3])} % auf ${P1(o.m[3])} % Marktanteil.`,
`Tabelle 4: Die Stärke von Alva liegt in der Preisklasse ${S[best3]} mit ${P1(o.m[best3])} % Marktanteil.`]},
{q:"b) Welches sind die 3 wichtigsten Erkenntnisse?",sol:[
`Der Markt ist ${o.tr>0?"leicht wachsend":"leicht rückläufig"}. Der grössere Teil des Umsatzes wird mit ${P1(100-o.on[2])} % noch stationär erzielt, es findet aber eine Verlagerung zu Online statt.`,
`Alva ist mit ${P1(o.A[2])} % Marktführer, im Premium-Segment über CHF 1'000 mit nur ${P1(o.m[3])} % jedoch stark untervertreten und rückläufig.`,
`Das Premium-Segment wächst und macht rund ${Math.round(o.sh2[3])} % des Marktes aus. Die Premium-Linie ist eine Chance, in dieser Preisklasse zu wachsen.`]},
{q:"c) Geben Sie eine realistische Umsatzerwartung für die Premium-Linie im ersten Jahr ab, mit Begründung.",hint:"Annahme: Das Marktvolumen über CHF 1'000 bleibt gleich.",sol:[
`Marktvolumen über CHF 1'000: ${P1(o.v[2])} × ${P1(o.sh2[3])} % = CHF ${P1(pv2)} Mio.`,
`Ziel: Marktanteil über CHF 1'000 von ${P1(o.m[3])} % auf rund ${z} % steigern (Niveau des Gesamtmarktanteils).`,
`Mehrumsatz: ${P1(pv2)} × ${P1(z-o.m[3])} % = rund CHF ${N(mehr,2)} Mio.`,
`Begründung: Alva ist Marktleader und beim Handel bereits gelistet, die Sortimentsausweitung bei bestehenden Wiederverkäufern ist leicht möglich.`],
note:"Andere Zielwerte sind möglich. Entscheidend sind der Rechenweg (Segmentvolumen × Zuwachs Marktanteil) und eine nachvollziehbare Begründung."}]}}

function genCov(){const c=ri(40,85,5),p=ri(80,950)/10,g=p/c*100,cat=pk(PANELCAT);
return{again:"Neue Zahlen",s:"Grundlagentest 2026, Aufgabe 3",intro:`Für den Markt ${cat} liegen Paneldaten vor. Das Panelmarktvolumen beträgt CHF ${P1(p)} Mio., die Panel Coverage ${c} %.`,

{q:"b) Berechnen Sie den Gesamtmarkt und zeigen Sie den Rechnungsweg.",sol:[`Rechnungsweg: Panelmarkt ÷ Coverage × 100`,`CHF ${P1(p)} Mio. ÷ ${c} × 100`,`Gesamtmarkt (100 %) = CHF ${P1(g)} Mio.`]}]}}

function tLernen(B){kaps.forEach((k,idx)=>{const c=cnt(k),it=el("div","item"),h=el("div","item-head"),nm=el("b");nm.append(el("span","num",idx+1),k);

B.append(el("h3",null,"Reihenfolge"));const o=el("div","grid");RH.forEach(s=>o.append(tile(s.t,"Schritte ordnen",()=>order(s))));B.append(o);

function run(title,mode){$("v-home").hidden=true;$("v-run").hidden=false;$("r-title").textContent=title||"Alle Kapitel";$("r-mode").textContent=mode;window.scrollTo(0,0)}
function prog(i,n){$("r-count").textContent=n?`${Math.min(i+1,n)} / ${n}`:"";$("r-bar").style.width=(n?i/n*100:0)+"%"}
function end(big,sub,actions,review){keyH=null;const c=$("r-card");c.innerHTML="";$("r-count").textContent="";$("r-bar").style.width="100%";
c.append(el("div","big",big),el("p","sub",sub));const r=el("div","row");actions.forEach(a=>r.append(a));r.append(btn("Zur Übersicht",null,home));c.append(r);
if(review&&review.length){c.append(el("h3",null,"Ihre Fehler"));review.forEach(x=>{const d=el("div","rev");d.append(el("b",null,x.q),el("span",null,"Lösung: "+x.opts[x.c]+(x.e?" – "+x.e:"")));c.append(d)})}
window.scrollTo(0,0)}

function cards(k,gaps){run(k,gaps?"Karteikarten · nur Lücken":"Karteikarten");
const deck=sh(pool(k).filter(d=>!gaps||st.cards[d.q]==="no"));let i=0,ok=0,no=0;
function show(){if(i>=deck.length){const a=[];if(no)a.push(btn(`Lücken wiederholen (${no})`,"primary",()=>cards(k,true)));
a.push(btn("Quiz zum Kapitel",no?null:"primary",()=>quiz(k)));return end(`${ok} / ${deck.length}`,"gewusst in dieser Runde",a)}
prog(i,deck.length);const d=deck[i],c=$("r-card");c.innerHTML="";c.append(el("p","q",d.q));
const r=el("div","row");r.append(btn("Aufdecken","primary",rev));c.append(r);let open=false;
function rev(){if(open)return;open=true;r.remove();c.append(el("div","a",d.a));if(d.img){const im=el("img","slide");im.src=d.img;im.alt="Folie: "+d.q;im.loading="lazy";im.onclick=()=>window.open(d.img,"_blank");c.append(im)}if(d.s)c.append(src(d.s));const r2=el("div","row");
r2.append(btn("Gewusst","good",()=>mark("ok")),btn("Nicht gewusst","miss",()=>mark("no")));c.append(r2)}
function mark(v){st.cards[d.q]=v;save();v==="ok"?ok++:no++;i++;show()}
keyH=e=>{if(e.code==="Space"){e.preventDefault();rev()}else if(open&&e.key==="ArrowRight")mark("ok");else if(open&&e.key==="ArrowLeft")mark("no")}}
show()}

function ask(title,mode,make,id){run(title,mode);keyH=null;const qs=make();let i=0,score=0;const wrong=[];
function show(){if(i>=qs.length){best(id,score,qs.length);return end(`${score} / ${qs.length}`,`${Math.round(score/qs.length*100)} % richtig`,[btn("Nochmals","primary",()=>ask(title,mode,make,id))],wrong)}
prog(i,qs.length);const d=qs[i],c=$("r-card");c.innerHTML="";if(d.tag)c.append(el("p","sub",d.tag));c.append(el("p","q",d.q));let done=false;
const bs=d.opts.map((t,j)=>{const b=btn(t,"opt",()=>{if(done)return;done=true;
if(j===d.c){score++;b.classList.add("right")}else{b.classList.add("wrong");bs[d.c].classList.add("right");wrong.push(d)}
if(d.e)c.append(el("p","ex",d.e));if(d.s)c.append(src(d.s));const n=btn(i+1<qs.length?"Weiter":"Resultat","primary",()=>{i++;show()});c.append(n);n.focus()});return b});
bs.forEach(b=>c.append(b))}
show()}

function order(s){run(s.t,"In der richtigen Reihenfolge anklicken");keyH=null;const n=s.s.length;let next=0,err=0;const c=$("r-card");c.innerHTML="";
const done=el("ol","done"),pl=el("div","row"),msg=el("p","sub","Was kommt an 1. Stelle?");c.append(done,pl,msg);prog(0,n);
sh(s.s.map((x,i)=>i)).forEach(i=>{const b=btn(s.s[i],null,()=>{if(i===next){b.remove();done.append(el("li",null,s.s[i]));next++;prog(next,n);
if(next===n)end(err?`${err} Fehler`:"Alles richtig",s.t,[btn("Nochmals","primary",()=>order(s))]);else msg.textContent=`Was kommt an ${next+1}. Stelle?`}
else{err++;b.classList.add("miss");setTimeout(()=>b.classList.remove("miss"),500);msg.textContent=`Falsch. Was kommt an ${next+1}. Stelle?`}});pl.append(b)})}

$("back").onclick=home;home();
