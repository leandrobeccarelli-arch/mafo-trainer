<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAFO Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f9;--surface:#fff;--fg:#17213a;--muted:#5b6680;--line:#dde2ec;--accent:#24407a;--accent-fg:#fff;--hot:#d9541a;--ok:#1d7a45;--bad:#b3261e;--ok-bg:#e3f4ea;--bad-bg:#fbe7e5;
--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#11151d;--surface:#1a202b;--fg:#e7ebf3;--muted:#9aa5ba;--line:#2b3342;--accent:#8fb0f0;--accent-fg:#0f1522;--hot:#ff8f55;--ok:#55c987;--bad:#ff7b72;--ok-bg:#16302a;--bad-bg:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:16px}
h1{font:700 30px/1.1 var(--display);margin:0}
h2{font:700 20px/1.2 var(--display);margin:0}
.sub{color:var(--muted);font-size:14px;margin:0;font-variant-numeric:tabular-nums}
button{font:500 15px/1 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.good{background:var(--ok);color:#fff;border-color:var(--ok)}.miss{background:var(--bad);color:#fff;border-color:var(--bad)}
.link{border:0;background:none;padding:4px 0;color:var(--muted);text-decoration:underline}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.track>i{display:block;height:100%;background:var(--ok)}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.item.all{border-color:var(--accent)}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.item-head b{font:600 17px/1.3 var(--display)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;min-width:0}
.q{font:600 21px/1.3 var(--display);margin:0;text-wrap:balance}
.a{border-top:1px dashed var(--line);padding-top:14px;white-space:pre-line}
.opt{width:100%;text-align:left;line-height:1.45;padding:13px 15px;white-space:pre-line}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
ol.done{margin:0;padding-left:22px;display:grid;gap:4px}
.big{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">

<section id="v-home" class="list">
<h1>MAFO Trainer</h1>
<p class="sub" id="h-sum"></p>
<div class="track"><i id="h-bar"></i></div>
<div class="list" id="h-list"></div>
<div id="h-reset"></div>
</section>

<section id="v-run" hidden>
<div class="list">
<div class="bar"><button id="back">← Übersicht</button><p class="sub" id="r-count"></p></div>
<div><h2 id="r-title"></h2><p class="sub" id="r-mode"></p></div>
<div class="track"><i id="r-bar"></i></div>
<div class="card" id="r-card" aria-live="polite"></div>
</div>
</section>
</div>
<script>
const D=[{"k": "Grundlagen", "q": "Wie wird Marktforschung definiert?", "a": "Systematische, objektive und professionelle Beschaffung und verwendungsgerechte Aufbereitung von Informationen, unter Anwendung wissenschaftlicher Methoden.\n… um Trends zu erkennen, Potenziale zu ermitteln und Risiken zu minimieren."}, {"k": "Grundlagen", "q": "Welche Möglichkeiten bietet die Marktforschung?", "a": "• Marktbeobachtung\n• Distributions- und Werbeanalyse\n• Imagemässige Profilierung und Positionierung der Marken\n• Untersuchung des Konsumentenverhaltens\n• Analyse der Kaufmotive und Kaufbarrieren\n• Pretesting vor Produkte-Einführungen"}, {"k": "Grundlagen", "q": "Wo stösst die Marktforschung an ihre Grenzen?", "a": "• Fehlendes Geld\n• Fehlende Zeit\n• Methodische Grenzen\n• Mangelndes Verständnis im Management\n• Mangelnder Wille, die Ergebnisse zu akzeptieren\n• Marktforschung als Bestätigung statt zur Erkenntnisfindung\n• Beschränkte Genauigkeit der Resultate"}, {"k": "Grundlagen", "q": "Wie ist die Marktforschung in der Praxis organisatorisch eingegliedert?", "a": "Stabsstelle des Marketings und des Verkaufs (Schnittstelle der beiden Abteilungen). Auch der Category Manager erfüllt die Funktion des internen Marktforschers."}, {"k": "Grundlagen", "q": "In welche zwei Formen wird die Marktforschung grundsätzlich unterschieden?", "a": "Primärforschung und Sekundärforschung."}, {"k": "Sekundär und Primär", "q": "Was versteht man unter sekundärer Marktforschung (Desk Research)?", "a": "Desk Research: stützt sich auf bereits vorhandene Informationen, die für einen anderen Zweck oder aus allgemeinem Interesse (Stat. Bundesamt) zusammengetragen wurden."}, {"k": "Sekundär und Primär", "q": "Nennen Sie innerbetriebliche Quellen der Sekundärforschung.", "a": "• Absatzstatistiken\n• Produktionsstatistiken\n• Planungsunterlagen\n• Informationen des Rechnungswesens\n• Rapporte über Kunden- und Messebesuche\n• Alte Marktforschungsunterlagen"}, {"k": "Sekundär und Primär", "q": "Nennen Sie ausserbetriebliche Quellen der Sekundärforschung.", "a": "• Staatliche und halbstaatliche Institutionen\n• Verbände\n• Marktforschungsinstitute\n• Banken\n• Fachzeitschriften\n• Forschungsberichte, Dissertationen\n• Tagespresse\n• Preislisten und Werbematerial der Konkurrenz\n• Messen und Ausstellungen"}, {"k": "Sekundär und Primär", "q": "Welche zwei Arten der primären Marktforschung werden unterschieden?", "a": "AD-HOC-Forschung und Panelforschung."}, {"k": "Sekundär und Primär", "q": "Was ist AD-HOC-Forschung?", "a": "Befasst sich mit einer aktuell auftretenden Fragestellung. Momentaufnahme.\nField Research: Informationen für eine bestimmte Problemstellung mit einer eigens dafür konzipierten Erhebung."}, {"k": "Sekundär und Primär", "q": "Welche Merkmale hat die Panelforschung und wie unterscheidet sie sich von AD-HOC?", "a": "• Regelmässig wiederkehrend\n• In zeitlich gleichmässigen Abständen\n• In der gleichbleibenden, repräsentativen Stichprobe\n• Unter Anwendung derselben Methode\n• Zum selben Untersuchungsgegenstand\nAD-HOC = Momentaufnahme, Panel = Film (zeigt Entwicklungen)."}, {"k": "Sekundär und Primär", "q": "Mit welchen Erhebungstechniken werden bei AD-HOC-Forschung Informationen gewonnen?", "a": "• Befragung = Personen werden spezifische Fragen gestellt\n• Beobachtung = Verhalten der Personen beobachten\n• Test bzw. Experiment = Personen werden auf bestimmte Reize getestet"}, {"k": "Sekundär und Primär", "q": "Welche Beobachtungsarten gibt es?", "a": "• Feldbeobachtung = Verhalten der Kunden in der Einkaufsstätte, Zählen oder Messen\n• Laborbeobachtung = unter kontrollierten Bedingungen im Labor"}, {"k": "Sekundär und Primär", "q": "Was ist der Unterschied zwischen Labortest, Markttest und Testmarkt?", "a": "• Labortest / TESI = im Forschungslabor, psychische und physiologische Reaktionen\n• Markttest = in einem abgrenzbaren Markt, gesamter Marketingmix\n• Testmarkt = abgegrenzter Markt, in dem Markttests durchgeführt werden"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist eine Vollerhebung und wann wird sie angewandt?", "a": "Alle relevanten Personen (Grundgesamtheit) werden befragt. Bei relativ kleiner Zahl; bei sehr grosser Grundgesamtheit nur bei der Volkszählung."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was ist eine Teilerhebung und welche Probleme stellen sich dabei?", "a": "Nur ein Teil (Stichprobe) der Grundgesamtheit. Probleme:\n• Repräsentanz\n• Grösse der Erhebungseinheiten\n• Zulässige Fehlerspanne\n• Grundsätze für die Wahl der Erhebungseinheiten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Hängt die Genauigkeit einer Stichprobe von der Grösse des Universums ab?", "a": "Je mehr Leute befragt werden, umso genauer. Die Genauigkeit hängt nicht von der Grösse des Universums ab: 1'000 Personen bei 8 Mio. sind gleich genau wie bei 4'000."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Was bedeutet Repräsentativität und welchen Einfluss hat die Stichprobengrösse darauf?", "a": "Je genauer die Stichprobe der Grundgesamtheit entspricht, desto grösser die Repräsentativität. Dann kann hochgerechnet (extrapoliert) werden.\nDie Stichprobengrösse beeinflusst nur die Genauigkeit, nicht die Repräsentativität."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Wann und wie funktioniert die Zufallsauswahl (Random-Verfahren)?", "a": "Wenn die Struktur der Grundgesamtheit nicht bekannt ist. Jedes Element hat die gleiche Chance. Führt immer zu einem repräsentativen Ergebnis."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche Arten der Zufallsauswahl gibt es?", "a": "• Reine Zufallsauswahl = Lotterieverfahren (Urne)\n• Geschichtete Zufallsauswahl (im Skript «gesichtete») = Untergruppen (Schichten), darin reiner Zufall\n• Klumpen-Auswahl (Cluster) = zufällige «Klumpen» mit allen Elementen"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche nichtzufälligen Auswahlverfahren gibt es und was setzen sie voraus?", "a": "Struktur der Grundgesamtheit muss bekannt sein.\n• Quota-Verfahren = Interviewer erhält Quoten von Merkmalen (Alter, Geschlecht, Kaufkraft)\n• Willkürliche Auswahl = Interviewer wählt nach Geratewohl; billigstes, am wenigsten repräsentativ"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Welche systematischen Fehler gibt es?", "a": "Entstehen durch individuelle Fehlleistungen:\n• Planungsfehler\n• Auswertungsfehler\n• Interviewer-Fehler (falsches Ausfüllen)\n• Fehler durch Befragten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Wodurch entstehen Zufallsfehler und wovon hängen sie ab?", "a": "Entstehen, weil mit einer Stichprobe gearbeitet wird:\n• Stichprobengrösse (n)\n• Merkmalsverteilung (p)\n• Sicherheitsgrad (t²), in der Regel 95.5 %"}, {"k": "Quantitativ und qualitativ", "q": "Was kennzeichnet die quantitative Marktforschung?", "a": "• Repräsentative Stichprobe\n• Wer, was, wie viel\n• Verhalten, Facts, Rationales\n• Fragebogen: voll- oder halbstrukturiert\n• Reporting: Facts, Tabellen"}, {"k": "Quantitativ und qualitativ", "q": "Was kennzeichnet die qualitative Marktforschung?", "a": "• Nicht repräsentative Stichprobe\n• Frage nach dem Warum (Motivforschung)\n• Irrationales\n• Kein Fragebogen, sondern Gesprächsleitfaden\n• Reporting: Interpretation, Summary"}, {"k": "Quantitativ und qualitativ", "q": "Welche Befragungsarten gibt es bei der quantitativen Marktforschung?", "a": "• Persönlich (Face to Face)\n• Telefonisch\n• Schriftlich (Papier)\n• Online"}, {"k": "Quantitativ und qualitativ", "q": "Welche Befragungsarten gibt es bei der qualitativen Marktforschung?", "a": "• Gruppendiskussion (Fokusgruppen), max. 12 Teilnehmer\n• Einzelexplorationen (Tiefeninterviews), 10 bis max. 50\nModeriert durch Psychologen, Grundlage: Gesprächsleitfaden."}, {"k": "Quantitativ und qualitativ", "q": "Wann wird qualitative Marktforschung oft eingesetzt?", "a": "Als Vorstudie zu einer quantitativen Befragung oder zusätzlich, wenn quantitative Ergebnisse nicht aufschlussreich genug sind."}, {"k": "Fragebogen", "q": "Was sind offene Fragen und was ist ihr Nachteil?", "a": "W-Fragen (wie, wo, wann, wieso, wer …), nicht mit Ja/Nein beantwortbar. Für qualitative Informationen; Auswertung aufwendig und teuer."}, {"k": "Fragebogen", "q": "Welche Typen geschlossener Fragen gibt es?", "a": "• Alternativfragen (Ja/Nein)\n• Multiple Choice (Mehrfach-Auswahl)\n• Skalierungsfragen\n• Schematisches Differential (Polaritätsprofil)"}, {"k": "Fragebogen", "q": "Warum müssen Skalierungsfragen geradestufig sein?", "a": "Immer geradestufig (z.B. 1–4), sonst wird oft die Mitte gewählt und das Ergebnis fällt neutral aus."}, {"k": "Fragebogen", "q": "Wofür wird das schematische Differential (Polaritätsprofil) verwendet?", "a": "Für Image, Wertvorstellungen oder Bewertung gegenüber der Konkurrenz."}, {"k": "Fragebogen", "q": "Wie ist ein Fragebogen aufgebaut?", "a": "1. Kontakt, Einleitungsfragen (Eisbrecher)\n2. Fragen zur Person\n3. Allgemeine Fragen zum Verhalten (7-W-Fragen)\n4. Bedürfnisse, Einstellung, Motivation, Defizite der Zielgruppe\n5. Programmfragen\n6. Kontrollfragen\nSo lang wie nötig, so kurz wie möglich."}, {"k": "Fragebogen", "q": "Was wird mit den allgemeinen Fragen zum Verhalten (7-W-Fragen) erfragt?", "a": "Wer geht wann, wo, mit wem, wie oft, bei welcher Gelegenheit an welches Konzert?\nAllgemeines Verhalten, nicht das eigene Thema."}, {"k": "Fragebogen", "q": "Was wird im Block Bedürfnisse, Einstellung, Motivation und Defizite gefragt?", "a": "Noch nicht das eigene Thema:\n• Worauf legt die Zielgruppe besonderen Wert? (Bedürfnisse)\n• Grundsätzliche Einstellung zum Thema\n• Was wird besucht/konsumiert und warum? (Motivation)\n• Bestehen Defizite? (Chance)"}, {"k": "Fragebogen", "q": "Was sind Programmfragen?", "a": "Konkrete Fragen zum eigenen Thema:\n• Entspricht es den Bedürfnissen der Zielgruppe?\n• Beurteilung der Idee\n• Was könnte man konkret verbessern?"}, {"k": "Fragebogen", "q": "Was sind Kontrollfragen?", "a": "Gewisse Fragen werden ein zweites Mal, anders formuliert, gestellt."}, {"k": "Fragebogen", "q": "Welche Anforderungen werden an einen Fragebogen gestellt?", "a": "• Fragenformulierung: einfach, klar, eindeutig, präzise, keine Suggestivfragen, keine Überforderung\n• Fragenreihenfolge: keine Beeinflussung, vom Allgemeinen zum Spezifischen, nicht langweilig\n• Fragebogenumfang: zumutbare Länge, Befragungssituation entscheidet\n• Interviewanweisung: klare Filterangaben"}, {"k": "Prozess und Briefing", "q": "Welche 6 Phasen hat der Marktforschungsprozess?", "a": "1. Problemformulierungsphase\n2. Checkphase\n3. Designphase\n4. Feldphase (Datengewinnung)\n5. Datenanalyse, Aufbereitung und Interpretation\n6. Dokumentationsphase, Kommunikation"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Problemformulierungsphase?", "a": "«Was will ich wissen?»\n• Untersuchungsziel definieren\n• Untersuchungsgegenstände definieren (z.B. Marktanteile, Logo, Bekanntheitsgrad)"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Checkphase?", "a": "• Bestimmung der Informationsquellen\n• Auswertung von vorhandenem Zahlenmaterial (sekundär)\n• Entscheid zur Durchführung eines Primärforschungsprojektes"}, {"k": "Prozess und Briefing", "q": "Was wird in der Designphase festgelegt?", "a": "• Forschungsmethoden festlegen\n• Grundgesamtheit festlegen\n• Stichprobe / Auswahlverfahren\n• Programmfragen definieren\n• Timing festlegen\n• Budget bestimmen\n• Entscheid Marktforschungsinstitut"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Feldphase?", "a": "• Fragebogen entwickeln\n• Fragebogen programmieren\n• Pilot (Probeinterviews)\n• Durchführung mit Interviewkontrolle"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Phase Datenanalyse, Aufbereitung und Interpretation?", "a": "• Datenauswertung und Plausibilisierung\n• Tabellen erstellen\n• Statistische Verfahren (Korrelation, Regression, Zeitreihenanalyse)\n• Grafische Darstellungen\n• Schlussfolgerungen und Empfehlungen"}, {"k": "Prozess und Briefing", "q": "Was geschieht in der Dokumentationsphase?", "a": "• Schriftlicher Forschungsbericht\n• Präsentation / Workshop\n• Umsetzung der Ergebnisse"}, {"k": "Prozess und Briefing", "q": "Welche 8 Punkte enthält ein Marktforschungsbriefing?", "a": "1. Ausgangslage\n2. Angaben zum Informationsproblem\n3. Forschungsstrategie und Forschungstechnik\n4. Kontrollwünsche\n5. Art der Berichterstattung\n6. Termine\n7. Budgetrahmen\n8. Dokumentation / Kontakt"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zu den Angaben zum Informationsproblem?", "a": "• Untersuchungsziel «Was wollen wir wissen?»\n• Themenkreis und Programmfragen\n• Arbeitshypothesen"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zur Forschungsstrategie und Forschungstechnik?", "a": "• Methodenwahl inkl. Begründung Wahl / Nichtwahl\n• Grundgesamtheit\n• Vollerhebung oder Stichprobe\n• Stichprobengrösse, tolerierbare Fehlergrösse\n• Auswahlverfahren"}, {"k": "Prozess und Briefing", "q": "Welche Kontrollwünsche können im Briefing stehen?", "a": "Interviewer-Auswahl, Probeinterviews, Einblick in Fragebogen, Rücklaufkontrolle, Anwesenheit bei Testinstruktionen / Gruppendiskussionen"}, {"k": "Prozess und Briefing", "q": "Was gehört im Briefing zur Berichterstattung und zu den Terminen?", "a": "Berichterstattung: schriftlicher Bericht, Grafiken, Präsentation / Workshop, elektronische Datenform.\nTermine: Planung, Pilot, Feldarbeit, Berichterstattung, Projektabschluss."}, {"k": "Prozess und Briefing", "q": "Nach welchen Kriterien beurteilt man eine Marktforschungsofferte?", "a": "• Vollständigkeit\n• Verständnis für die Probleme des Auftraggebers\n• Angepasstheit der Methode\n• Zweckmässigkeit von Organisation und Auswertung\n• Pilot?\n• Interviewer-Briefing im Beisein des Auftraggebers?\n• Stellenwert der Datenqualität\n• Gewicht der Berichterstattung\n• Preis-/Leistungsrelation\n• Bekanntheit / Image des Instituts"}, {"k": "Testarten und Sonderformen", "q": "Welche Testarten gehören zu den 4P des Marketing-Mix?", "a": "• Product: Produktetests\n• Promotion: Werbemitteltests\n• Price: Preisfindungstest\n• Placement: Mystery Shopping"}, {"k": "Testarten und Sonderformen", "q": "Mit welchen Verfahren kann ein Produkt getestet werden?", "a": "• Produkteakzeptanz-Test\n• Geschmackstest\n• Gebrauchs- und Eignungstest\n• Blindtest\n• Konzepttest / «as market»\n• Packungstest\n• Preisgestaltung"}, {"k": "Testarten und Sonderformen", "q": "Wie werden Werbemittel getestet?", "a": "Pretest vor, Posttest nach der Kampagne.\n• Recognition Test = Wiedererkennung\n• Aided Recall = gestützte Bekanntheit\n• Unaided Recall = ungestützte Bekanntheit\n• Werbetracking = wiederkehrende Messung\n• Copytest = gemäss Kriterien der Copyplattform"}, {"k": "Testarten und Sonderformen", "q": "Was ist Mystery Shopping?", "a": "Anonyme Testkäufer überprüfen Servicequalität und Kundenorientierung: Freundlichkeit, Beratungsqualität, Fachkompetenz, Zustand der Verkaufsräume."}, {"k": "Testarten und Sonderformen", "q": "Was ist eine Omnibusbefragung?", "a": "Mehrthemenumfrage, mehrere Auftraggeber mit wenigen Fragen. Wöchentlich, repräsentativ für 14–74 Jahre. Online (E-Bus) oder telefonisch (Telebus)."}, {"k": "Testarten und Sonderformen", "q": "Was kostet eine Frage im Omnibus bei 1'000 Interviews?", "a": "• Geschlossene Frage CHF 900\n• Skala-Frage CHF 1'200\n• Offene Frage CHF 1'500"}, {"k": "Testarten und Sonderformen", "q": "Welche Vor- und Nachteile hat eine Omnibusbefragung?", "a": "Vorteil: wenige Fragen mit vertretbarem Aufwand.\nNachteil: Themen anderer Auftraggeber können die eigenen Resultate beeinträchtigen."}, {"k": "Testarten und Sonderformen", "q": "Welche weiteren Sonderformen der Marktforschung kennen Sie?", "a": "• PKS – Demoscope: Psychologische Karte der Schweiz\n• MACH Consumer: grösste Schweizer Studie, 11'000 Interviews\n• Link im Auftrag der WEMF: Werbemittelaffinität\n• SINUS Milieu: Segmentation nach psychografischen Merkmalen\n• Euro Sozio Styls – GfK: Lebensstilforschung"}, {"k": "Panelforschung", "q": "Welche zwei Ansätze gibt es in der Panelforschung?", "a": "Detailhandelspanel und Haushaltpanel (Konsumentenpanel)."}, {"k": "Panelforschung", "q": "Was misst das Detailhandelspanel und wer bietet es an?", "a": "Misst die Verkäufe des Detailhandels (Kassen-Scannerdaten).\nFood / Near-Food: Nielsen IQ (Root LU). Non-Food: GfK (seit 2023 zu Nielsen IQ)."}, {"k": "Panelforschung", "q": "Welche Daten liefert das Detailhandelspanel?", "a": "• Marktentwicklung\n• Marktanteile\n• Hitlisten / Topseller\n• Verkäufe des Handels\n• Lagerbestände\n• Distributionswerte (numerisch, gewichtet)\n• Verkaufspreise"}, {"k": "Panelforschung", "q": "Welche Vor- und Nachteile hat das Detailhandelspanel?", "a": "Vorteile: Verkaufssteuerung, Infos über den POS, Konkurrenzinformationen, inkl. Tessin, sehr genaue Abverkaufszahlen, Einkäufe aller Käufergruppen.\nNachteile: es fehlen Kioske und Fachhandel; keine Informationen über Käufer."}, {"k": "Panelforschung", "q": "Welche Kanäle sind im Nielsen-Food/Nearfood-Panel nicht abgedeckt?", "a": "• Discounter (Aldi, Lidl)\n• HOREKA (Cash & Carry)\n• Tankstellen / Kioske\n• Spezialgeschäfte"}, {"k": "Panelforschung", "q": "Wie funktioniert das Haushaltpanel?", "a": "3'000 repräsentative Haushalte (D- und F-CH), Handscanner, Kassenbon oder EAN. Ungenauer als das Detailhandelspanel, aber Käuferanalysen möglich. Für Non-Food gibt es in der Schweiz keines."}, {"k": "Panelforschung", "q": "Welche Daten liefert das Haushaltpanel?", "a": "• Marktentwicklung und Marktanteile\n• Durchschnittspreise\n• Verteileranteile (Coop, Migros, Denner, Aldi, Lidl)\n• Käuferstruktur\n• Einkaufsmenge pro Haushalt\n• Wiederkaufsraten\n• Käuferwanderungen"}, {"k": "Panelforschung", "q": "Welche Vor- und Nachteile hat das Haushaltpanel?", "a": "Vorteile: alle Produkte des täglichen Bedarfs, Konsumentendaten, alle Kanäle (auch Aldi, Lidl), Käuferanalysen, Haushaltstruktur.\nNachteile: nur private Haushalte, keine Lagerdaten, Impuls- und Ausser-Haus-Konsum fehlen, Tessin nicht abgedeckt, Verzerrung bei heiklen Categorys, keine Distributionskennzahlen."}, {"k": "Institute und Datenschutz", "q": "Welche Marktforschungsinstitute sind international und national bedeutend?", "a": "International: Nielsen IQ, GfK, IPSOS (TNS, NPD nicht in CH).\nNational: LINK (Luzern), DemoSCOPE (Adligenswil), GfS (Bern), ISO Public (Schwerzenbach)."}, {"k": "Institute und Datenschutz", "q": "Wer ist der EDÖB und welche Aufgaben hat er?", "a": "Eidg. Datenschutz- und Öffentlichkeitsbeauftragter, Sitz Bern. Berät Private, beaufsichtigt Private und Bundesorgane, erstattet dem Bundesrat Bericht zum Öffentlichkeitsgesetz."}, {"k": "Institute und Datenschutz", "q": "Wo ist der Datenschutz in der Schweiz geregelt?", "a": "Bundesgesetz für Bundesbehörden und Private. Kantonale Behörden: kantonale Gesetze."}, {"k": "Institute und Datenschutz", "q": "Was bedeutet die Informationspflicht?", "a": "In der Schweiz gilt neben der Auskunftspflicht auch die Informationspflicht: Betroffene müssen unaufgefordert informiert werden."}, {"k": "Institute und Datenschutz", "q": "Was ist beim Datenschutz bei Umfragen zu beachten?", "a": "Der Auftraggeber darf nicht den kompletten Adressbestand an das durchführende Unternehmen weitergeben."}, {"k": "Institute und Datenschutz", "q": "Ist Adresshandel in der Schweiz erlaubt?", "a": "Nicht verboten, aber enge Grenzen. Adresse kann für Werbezwecke gesperrt werden."}, {"k": "Institute und Datenschutz", "q": "Was gilt bei der Datenübermittlung ins Ausland?", "a": "Daten müssen ausreichend geschützt sein (Art. 7 DSG): Integrität, Vertraulichkeit und Verfügbarkeit sichern."}];
const P=[["Problem formulieren",["«Was will ich wissen?»","Untersuchungsziel definieren","Untersuchungsgegenstände (z.B. Marktanteile)"]],
["Checkphase",["Bestimmung der Informationsquellen","Was ist vorhanden (sekundär)?","Was muss ermittelt werden (primär)?","Entscheid zur Primärforschung"]],
["Designphase",["Methode festlegen","Grundgesamtheit festlegen","Stichprobe und Auswahlverfahren","Entscheid MAFO-Institut","Timing und Budget bestimmen","Programmfragen definieren"]],
["Feldphase – Datengewinn",["Fragebogen erstellen","Interviewer-Auswahl","Interviewer-Schulung","Pilot (Probeinterviews)","Durchführung im Feld"]],
["Datenanalyse, Aufbereitung, Interpretation",["Fragebogen auswerten","Tabellen erstellen","Statistische Verfahren","Grafische Darstellungen","Schlussfolgerungen und Empfehlungen"]],
["Dokumentationsphase, Kommunikation, Umsetzung",["Schriftlicher Forschungsbericht","Präsentation / Workshop","Umsetzung Massnahmen"]]];
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const btn=(x,c,f)=>{const b=el("button",c,x);b.onclick=f;return b};
let st={};try{st=JSON.parse(localStorage.getItem("mafo-v2")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("mafo-v2",JSON.stringify(st))}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const kaps=[...new Set(D.map(d=>d.k))];
const pool=k=>D.filter(d=>!k||d.k===k);
const cnt=k=>{const p=pool(k);return{n:p.length,ok:p.filter(d=>st[d.q]==="ok").length,no:p.filter(d=>st[d.q]==="no").length}};
let keyH=null;
document.addEventListener("keydown",e=>{if(keyH)keyH(e)});

function home(){keyH=null;$("v-run").hidden=true;$("v-home").hidden=false;
const a=cnt("");$("h-sum").textContent=`${a.ok} von ${a.n} Karten gewusst · ${a.no} Lücken`;$("h-bar").style.width=(a.ok/a.n*100)+"%";
const L=$("h-list");L.innerHTML="";
[""].concat(kaps).forEach((k,idx)=>{const c=cnt(k);const it=el("div","item"+(k?"":" all"));
const h=el("div","item-head");h.append(el("b",null,k?`${idx}. ${k}`:"Alle Kapitel"),el("span","sub",`${c.ok}/${c.n} gewusst`));
const t=el("div","track");const i=el("i");i.style.width=(c.ok/c.n*100)+"%";t.append(i);
const r=el("div","row");r.append(btn("Lernen","primary",()=>cards(k,false)),btn("Quiz",null,()=>quiz(k)));
if(c.no)r.append(btn(`Lücken (${c.no})`,null,()=>cards(k,true)));
if(k==="Prozess und Briefing")r.append(btn("6 Phasen: Reihenfolge",null,phOrd),btn("6 Phasen: Zuordnen",null,phZu));
it.append(h,t,r);L.append(it)});
const R=$("h-reset");R.innerHTML="";R.append(btn("Lernstand zurücksetzen","link",()=>{R.innerHTML="";const w=el("div","row");
w.append(el("span","sub","Sicher?"),btn("Ja, zurücksetzen","miss",()=>{st={};save();home()}),btn("Abbrechen",null,home));R.append(w)}));
window.scrollTo(0,0)}

function run(title,mode){$("v-home").hidden=true;$("v-run").hidden=false;$("r-title").textContent=title||"Alle Kapitel";$("r-mode").textContent=mode;window.scrollTo(0,0)}
function prog(i,n){$("r-count").textContent=n?`${Math.min(i+1,n)} / ${n}`:"";$("r-bar").style.width=(n?i/n*100:0)+"%"}
function end(lines,actions){keyH=null;const c=$("r-card");c.innerHTML="";$("r-count").textContent="";$("r-bar").style.width="100%";
lines.forEach((l,i)=>c.append(el(i?"p":"div",i?"sub":"big",l)));const r=el("div","row");actions.forEach(a=>r.append(a));r.append(btn("Zur Übersicht",null,home));c.append(r)}

function cards(k,gaps){run(k,gaps?"Karteikarten · nur Lücken":"Karteikarten");
const deck=sh(pool(k).filter(d=>!gaps||st[d.q]==="no"));let i=0,ok=0,no=0;
function show(){if(i>=deck.length){const again=[];if(no)again.push(btn(`Lücken wiederholen (${no})`,"primary",()=>cards(k,true)));
again.push(btn("Nochmals alle",no?null:"primary",()=>cards(k,false)));return end([`${ok} / ${deck.length}`,"gewusst in dieser Runde"],again)}
prog(i,deck.length);const d=deck[i],c=$("r-card");c.innerHTML="";c.append(el("p","q",d.q));
const r=el("div","row");r.append(btn("Aufdecken","primary",rev));c.append(r);
let open=false;
function rev(){if(open)return;open=true;r.remove();c.append(el("div","a",d.a));const r2=el("div","row");
r2.append(btn("Gewusst","good",()=>mark("ok")),btn("Nicht gewusst","miss",()=>mark("no")));c.append(r2)}
function mark(v){st[d.q]=v;save();v==="ok"?ok++:no++;i++;show()}
keyH=e=>{if(e.code==="Space"){e.preventDefault();rev()}else if(open&&e.key==="ArrowRight")mark("ok");else if(open&&e.key==="ArrowLeft")mark("no")}}
show()}

function quiz(k){run(k,"Quiz");keyH=null;const qs=sh(pool(k)).slice(0,10);let i=0,score=0;
function show(){if(i>=qs.length)return end([`${score} / ${qs.length}`,"richtig beantwortet"],[btn("Neues Quiz","primary",()=>quiz(k))]);
prog(i,qs.length);const d=qs[i],c=$("r-card");c.innerHTML="";c.append(el("p","q",d.q));
let o=sh(D.filter(x=>x.a!==d.a&&x.k===d.k));if(o.length<3)o=o.concat(sh(D.filter(x=>x.a!==d.a&&x.k!==d.k)));
const opts=sh([d,...o.slice(0,3)]);let done=false;const bs=opts.map(x=>{const b=btn(x.a,"opt",()=>{if(done)return;done=true;
if(x===d){score++;b.classList.add("right");if(!st[d.q])st[d.q]="ok"}else{b.classList.add("wrong");bs[opts.indexOf(d)].classList.add("right");st[d.q]="no"}
save();const n=btn(i+1<qs.length?"Weiter":"Resultat","primary",()=>{i++;show()});c.append(n);n.focus()});return b});
bs.forEach(b=>c.append(b))}
show()}

function phOrd(){run("6 Phasen","Phasen in der richtigen Reihenfolge anklicken");let next=0,err=0;const c=$("r-card");c.innerHTML="";
const done=el("ol","done"),pl=el("div","row"),msg=el("p","sub","Phase 1?");c.append(done,pl,msg);prog(0,6);keyH=null;
sh(P.map((x,i)=>i)).forEach(i=>{const b=btn(P[i][0],null,()=>{if(i===next){b.remove();done.append(el("li",null,P[i][0]));next++;prog(next,6);
if(next===6)end([err?`${err} Fehler`:"Alles richtig","Reihenfolge der 6 Phasen"],[btn("Nochmals","primary",phOrd),btn("Zuordnen üben",null,phZu)]);else msg.textContent=`Phase ${next+1}?`}
else{err++;b.classList.add("miss");setTimeout(()=>b.classList.remove("miss"),500);msg.textContent="Falsch."}});pl.append(b)})}

function phZu(){run("6 Phasen","Stichwort der richtigen Phase zuordnen");keyH=null;const qs=sh(P.flatMap((x,i)=>x[1].map(s=>[s,i]))).slice(0,10);let i=0,score=0;
function show(){if(i>=qs.length)return end([`${score} / ${qs.length}`,"richtig zugeordnet"],[btn("Neue Runde","primary",phZu),btn("Reihenfolge üben",null,phOrd)]);
prog(i,qs.length);const [s,r]=qs[i],c=$("r-card");c.innerHTML="";c.append(el("p","q",s));let done=false;
const bs=P.map((x,j)=>{const b=btn((j+1)+". "+x[0],"opt",()=>{if(done)return;done=true;if(j===r){score++;b.classList.add("right")}else{b.classList.add("wrong");bs[r].classList.add("right")}
const n=btn(i+1<qs.length?"Weiter":"Resultat","primary",()=>{i++;show()});c.append(n);n.focus()});return b});bs.forEach(b=>c.append(b))}
show()}

$("back").onclick=home;home();
</script></body></html>
