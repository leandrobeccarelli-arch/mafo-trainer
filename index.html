<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAFO Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: schmale Lernspalte, Kopf mit Kennzahlen, darunter Modus-Umschalter und eine Arbeitskarte */
:root{--bg:#f3f5f9;--surface:#ffffff;--fg:#17213a;--muted:#5b6680;--line:#dde2ec;--accent:#24407a;--accent-fg:#ffffff;--hot:#d9541a;--ok:#1d7a45;--bad:#b3261e;--ok-bg:#e3f4ea;--bad-bg:#fbe7e5;
--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--fg:#e7ebf3;--muted:#9aa5ba;--line:#2b3342;--accent:#8fb0f0;--accent-fg:#0f1522;--hot:#ff8f55;--ok:#55c987;--bad:#ff7b72;--ok-bg:#16302a;--bad-bg:#3a1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--fg:#e7ebf3;--muted:#9aa5ba;--line:#2b3342;--accent:#8fb0f0;--accent-fg:#0f1522;--hot:#ff8f55;--ok:#55c987;--bad:#ff7b72;--ok-bg:#16302a;--bad-bg:#3a1d1d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--hot)}
h1{font:700 clamp(30px,6vw,44px)/1.05 var(--display);margin:6px 0 8px;text-wrap:balance}
.lead{color:var(--muted);max-width:60ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}.chip.ok b{color:var(--ok)}.chip.bad b{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
button{font:500 15px/1 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 15px;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:500 15px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.track>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;min-width:0}
.q{font:600 21px/1.3 var(--display);margin:0;text-wrap:balance}
.a{border-top:1px dashed var(--line);padding-top:14px;white-space:pre-line;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.good{background:var(--ok);color:#fff;border-color:var(--ok)}.miss{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt{width:100%;text-align:left;line-height:1.45;padding:13px 15px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.hint{color:var(--muted);font-size:13px;margin:0}
table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--line);padding:10px 6px;vertical-align:top}td:first-child{font-weight:600;width:36%}
.tbl{overflow-x:auto}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.track>i{transition:none}}
@media (max-width:480px){.controls{flex-direction:column;align-items:stretch}.seg{width:100%}.seg button{flex:1;padding-inline:6px}}
</style>
</head><body>
<div class="wrap">
<header>
<h1>MAFO Trainer</h1>
</header>
<div class="stats" id="stats"></div>
<div class="track" aria-hidden="true"><i id="bar"></i></div>
<div class="controls">
<div class="seg" role="group" aria-label="Modus">
<button id="m-cards" aria-pressed="true">Karteikarten</button><button id="m-quiz" aria-pressed="false">Quiz</button><button id="m-phasen" aria-pressed="false">6 Phasen</button></div>
<label class="hint" for="kap" hidden>Kapitel</label><select id="kap" aria-label="Kapitel"></select>
</div>

<section id="v-cards" class="card" aria-live="polite">
<div class="eyebrow" id="ck"></div><p class="q" id="cq"></p><div class="a" id="ca" hidden></div>
<div class="row" id="r1"><button class="primary" id="show">Aufdecken</button></div>
<div class="row" id="r2" hidden><button class="good" id="yes">Gewusst</button><button class="miss" id="no">Nicht gewusst</button></div>
</section>
<div class="row" id="cardTools"><button id="onlyWrong" aria-pressed="false">Nur Lücken</button>
<span class="confirm" id="resetBox"><button id="reset">Zurücksetzen</button></span></div>

<section id="v-quiz" class="card" hidden aria-live="polite">
<div class="eyebrow" id="qk"></div><p class="q" id="qq"></p><div id="opts" style="display:grid;gap:8px"></div>
<div class="row"><button class="primary" id="next" hidden>Nächste Frage</button></div>
<p class="hint" id="qs"></p>
</section>

<section id="v-phasen" class="card" hidden aria-live="polite">
<div class="row"><button id="p-ord" class="primary">Reihenfolge</button><button id="p-zu">Zuordnen</button></div>
<div id="p-area" style="display:grid;gap:10px"></div>
<p class="hint" id="p-msg"></p>
</section>
</div>
<script>
const D=[{"k": "Grundlagen", "q": "Definition Marktforschung", "a": "Systematische, objektive und professionelle Beschaffung und verwendungsgerechte Aufbereitung von Informationen, unter Anwendung wissenschaftlicher Methoden.\n… um Trends zu erkennen, Potenziale zu ermitteln und Risiken zu minimieren."}, {"k": "Grundlagen", "q": "Möglichkeiten der Marktforschung", "a": "• Marktbeobachtung\n• Distributions- und Werbeanalyse\n• Imagemässige Profilierung und Positionierung der Marken\n• Untersuchung des Konsumentenverhaltens\n• Analyse der Kaufmotive und Kaufbarrieren\n• Pretesting vor Produkte-Einführungen"}, {"k": "Grundlagen", "q": "Grenzen der Marktforschung", "a": "• Fehlendes Geld\n• Fehlende Zeit\n• Methodische Grenzen\n• Mangelndes Verständnis im Management\n• Mangelnder Wille, die Ergebnisse zu akzeptieren\n• Marktforschung als Bestätigung statt zur Erkenntnisfindung\n• Beschränkte Genauigkeit der Resultate"}, {"k": "Grundlagen", "q": "Organisatorische Eingliederung", "a": "Stabsstelle des Marketings und des Verkaufs (Schnittstelle der beiden Abteilungen). Auch der Category Manager erfüllt die Funktion des internen Marktforschers."}, {"k": "Grundlagen", "q": "Quellen und Formen der Marktforschung", "a": "Primärforschung und Sekundärforschung."}, {"k": "Sekundär und Primär", "q": "Sekundäre Marktforschung", "a": "Desk Research: stützt sich auf bereits vorhandene Informationen, die für einen anderen Zweck oder aus allgemeinem Interesse (Stat. Bundesamt) zusammengetragen wurden."}, {"k": "Sekundär und Primär", "q": "Innerbetriebliche Quellen (interne Daten)", "a": "• Absatzstatistiken\n• Produktionsstatistiken\n• Planungsunterlagen\n• Informationen des Rechnungswesens\n• Rapporte über Kunden- und Messebesuche\n• Alte Marktforschungsunterlagen"}, {"k": "Sekundär und Primär", "q": "Ausserbetriebliche Quellen (externe Daten)", "a": "• Staatliche und halbstaatliche Institutionen\n• Verbände\n• Marktforschungsinstitute\n• Banken\n• Fachzeitschriften\n• Forschungsberichte, Dissertationen\n• Tagespresse\n• Preislisten und Werbematerial der Konkurrenz\n• Messen und Ausstellungen"}, {"k": "Sekundär und Primär", "q": "Primäre Marktforschung: zwei Arten", "a": "AD-HOC-Forschung und Panelforschung."}, {"k": "Sekundär und Primär", "q": "AD-HOC-Forschung", "a": "Befasst sich mit einer aktuell auftretenden Fragestellung. Momentaufnahme.\nField Research: Informationen für eine bestimmte Problemstellung mit einer eigens dafür konzipierten Erhebung."}, {"k": "Sekundär und Primär", "q": "Panelforschung: Merkmale", "a": "• Regelmässig wiederkehrend\n• In zeitlich gleichmässigen Abständen\n• In der gleichbleibenden, repräsentativen Stichprobe\n• Unter Anwendung derselben Methode\n• Zum selben Untersuchungsgegenstand\nAD-HOC = Momentaufnahme, Panel = Film (zeigt Entwicklungen)."}, {"k": "Sekundär und Primär", "q": "Erhebungstechniken AD-HOC", "a": "• Befragung = Personen werden spezifische Fragen gestellt\n• Beobachtung = Verhalten der Personen beobachten\n• Test bzw. Experiment = Personen werden auf bestimmte Reize getestet"}, {"k": "Sekundär und Primär", "q": "Beobachtungsarten", "a": "• Feldbeobachtung = Verhalten der Kunden in der Einkaufsstätte, Zählen oder Messen\n• Laborbeobachtung = unter kontrollierten Bedingungen im Labor"}, {"k": "Sekundär und Primär", "q": "Marktforschungstests", "a": "• Labortest / TESI = im Forschungslabor, psychische und physiologische Reaktionen\n• Markttest = in einem abgrenzbaren Markt, gesamter Marketingmix\n• Testmarkt = abgegrenzter Markt, in dem Markttests durchgeführt werden"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Vollerhebung", "a": "Alle relevanten Personen (Grundgesamtheit) werden befragt. Bei relativ kleiner Zahl; bei sehr grosser Grundgesamtheit nur bei der Volkszählung."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Teilerhebung", "a": "Nur ein Teil (Stichprobe) der Grundgesamtheit. Probleme:\n• Repräsentanz\n• Grösse der Erhebungseinheiten\n• Zulässige Fehlerspanne\n• Grundsätze für die Wahl der Erhebungseinheiten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Stichprobengrösse und Genauigkeit", "a": "Je mehr Leute befragt werden, umso genauer. Die Genauigkeit hängt nicht von der Grösse des Universums ab: 1'000 Personen bei 8 Mio. sind gleich genau wie bei 4'000."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Repräsentativität", "a": "Je genauer die Stichprobe der Grundgesamtheit entspricht, desto grösser die Repräsentativität. Dann kann hochgerechnet (extrapoliert) werden.\nDie Stichprobengrösse beeinflusst nur die Genauigkeit, nicht die Repräsentativität."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Zufallsauswahl (Random-Verfahren)", "a": "Wenn die Struktur der Grundgesamtheit nicht bekannt ist. Jedes Element hat die gleiche Chance. Führt immer zu einem repräsentativen Ergebnis."}, {"k": "Stichprobe und Auswahlverfahren", "q": "Arten der Zufallsauswahl", "a": "• Reine Zufallsauswahl = Lotterieverfahren (Urne)\n• Geschichtete Zufallsauswahl (im Skript «gesichtete») = Untergruppen (Schichten), darin reiner Zufall\n• Klumpen-Auswahl (Cluster) = zufällige «Klumpen» mit allen Elementen"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Nichtzufällige Auswahlverfahren", "a": "Struktur der Grundgesamtheit muss bekannt sein.\n• Quota-Verfahren = Interviewer erhält Quoten von Merkmalen (Alter, Geschlecht, Kaufkraft)\n• Willkürliche Auswahl = Interviewer wählt nach Geratewohl; billigstes, am wenigsten repräsentativ"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Systematische Fehler", "a": "Entstehen durch individuelle Fehlleistungen:\n• Planungsfehler\n• Auswertungsfehler\n• Interviewer-Fehler (falsches Ausfüllen)\n• Fehler durch Befragten"}, {"k": "Stichprobe und Auswahlverfahren", "q": "Zufallsfehler", "a": "Entstehen, weil mit einer Stichprobe gearbeitet wird:\n• Stichprobengrösse (n)\n• Merkmalsverteilung (p)\n• Sicherheitsgrad (t²), in der Regel 95.5 %"}, {"k": "Quantitativ und qualitativ", "q": "Quantitative Marktforschung", "a": "• Repräsentative Stichprobe\n• Wer, was, wie viel\n• Verhalten, Facts, Rationales\n• Fragebogen: voll- oder halbstrukturiert\n• Reporting: Facts, Tabellen"}, {"k": "Quantitativ und qualitativ", "q": "Qualitative Marktforschung", "a": "• Nicht repräsentative Stichprobe\n• Frage nach dem Warum (Motivforschung)\n• Irrationales\n• Kein Fragebogen, sondern Gesprächsleitfaden\n• Reporting: Interpretation, Summary"}, {"k": "Quantitativ und qualitativ", "q": "Befragungsarten quantitativ", "a": "• Persönlich (Face to Face)\n• Telefonisch\n• Schriftlich (Papier)\n• Online"}, {"k": "Quantitativ und qualitativ", "q": "Befragungsarten qualitativ", "a": "• Gruppendiskussion (Fokusgruppen), max. 12 Teilnehmer\n• Einzelexplorationen (Tiefeninterviews), 10 bis max. 50\nModeriert durch Psychologen, Grundlage: Gesprächsleitfaden."}, {"k": "Quantitativ und qualitativ", "q": "Einsatz qualitativer Forschung", "a": "Als Vorstudie zu einer quantitativen Befragung oder zusätzlich, wenn quantitative Ergebnisse nicht aufschlussreich genug sind."}, {"k": "Fragebogen", "q": "Offene Fragen", "a": "W-Fragen (wie, wo, wann, wieso, wer …), nicht mit Ja/Nein beantwortbar. Für qualitative Informationen; Auswertung aufwendig und teuer."}, {"k": "Fragebogen", "q": "Geschlossene Fragen: Fragetypen", "a": "• Alternativfragen (Ja/Nein)\n• Multiple Choice (Mehrfach-Auswahl)\n• Skalierungsfragen\n• Schematisches Differential (Polaritätsprofil)"}, {"k": "Fragebogen", "q": "Skalierungsfragen", "a": "Immer geradestufig (z.B. 1–4), sonst wird oft die Mitte gewählt und das Ergebnis fällt neutral aus."}, {"k": "Fragebogen", "q": "Schematisches Differential (Polaritätsprofil)", "a": "Für Image, Wertvorstellungen oder Bewertung gegenüber der Konkurrenz."}, {"k": "Fragebogen", "q": "Fragebogenaufbau (trichterförmig)", "a": "1. Kontakt, Einleitungsfragen (Eisbrecher)\n2. Fragen zur Person\n3. Allgemeine Fragen zum Verhalten (7-W-Fragen)\n4. Bedürfnisse, Einstellung, Motivation, Defizite der Zielgruppe\n5. Programmfragen\n6. Kontrollfragen\nSo lang wie nötig, so kurz wie möglich."}, {"k": "Fragebogen", "q": "7-W-Fragen (Beispiel Skript)", "a": "Wer geht wann, wo, mit wem, wie oft, bei welcher Gelegenheit an welches Konzert?\nAllgemeines Verhalten, nicht das eigene Thema."}, {"k": "Fragebogen", "q": "Bedürfnisse, Einstellung, Motivation, Defizite", "a": "Noch nicht das eigene Thema:\n• Worauf legt die Zielgruppe besonderen Wert? (Bedürfnisse)\n• Grundsätzliche Einstellung zum Thema\n• Was wird besucht/konsumiert und warum? (Motivation)\n• Bestehen Defizite? (Chance)"}, {"k": "Fragebogen", "q": "Programmfragen", "a": "Konkrete Fragen zum eigenen Thema:\n• Entspricht es den Bedürfnissen der Zielgruppe?\n• Beurteilung der Idee\n• Was könnte man konkret verbessern?"}, {"k": "Fragebogen", "q": "Kontrollfragen", "a": "Gewisse Fragen werden ein zweites Mal, anders formuliert, gestellt."}, {"k": "Fragebogen", "q": "Anforderungen an einen Fragebogen", "a": "• Fragenformulierung: einfach, klar, eindeutig, präzise, keine Suggestivfragen, keine Überforderung\n• Fragenreihenfolge: keine Beeinflussung, vom Allgemeinen zum Spezifischen, nicht langweilig\n• Fragebogenumfang: zumutbare Länge, Befragungssituation entscheidet\n• Interviewanweisung: klare Filterangaben"}, {"k": "Prozess und Briefing", "q": "Marktforschungsprozess: 6 Phasen", "a": "1. Problemformulierungsphase\n2. Checkphase\n3. Designphase\n4. Feldphase (Datengewinnung)\n5. Datenanalyse, Aufbereitung und Interpretation\n6. Dokumentationsphase, Kommunikation"}, {"k": "Prozess und Briefing", "q": "1. Problemformulierungsphase", "a": "«Was will ich wissen?»\n• Untersuchungsziel definieren\n• Untersuchungsgegenstände definieren (z.B. Marktanteile, Logo, Bekanntheitsgrad)"}, {"k": "Prozess und Briefing", "q": "2. Checkphase", "a": "• Bestimmung der Informationsquellen\n• Auswertung von vorhandenem Zahlenmaterial (sekundär)\n• Entscheid zur Durchführung eines Primärforschungsprojektes"}, {"k": "Prozess und Briefing", "q": "3. Designphase", "a": "• Forschungsmethoden festlegen\n• Grundgesamtheit festlegen\n• Stichprobe / Auswahlverfahren\n• Programmfragen definieren\n• Timing festlegen\n• Budget bestimmen\n• Entscheid Marktforschungsinstitut"}, {"k": "Prozess und Briefing", "q": "4. Feldphase", "a": "• Fragebogen entwickeln\n• Fragebogen programmieren\n• Pilot (Probeinterviews)\n• Durchführung mit Interviewkontrolle"}, {"k": "Prozess und Briefing", "q": "5. Datenanalyse", "a": "• Datenauswertung und Plausibilisierung\n• Tabellen erstellen\n• Statistische Verfahren (Korrelation, Regression, Zeitreihenanalyse)\n• Grafische Darstellungen\n• Schlussfolgerungen und Empfehlungen"}, {"k": "Prozess und Briefing", "q": "6. Dokumentationsphase", "a": "• Schriftlicher Forschungsbericht\n• Präsentation / Workshop\n• Umsetzung der Ergebnisse"}, {"k": "Prozess und Briefing", "q": "Marktforschungsbriefing: 8 Punkte", "a": "1. Ausgangslage\n2. Angaben zum Informationsproblem\n3. Forschungsstrategie und Forschungstechnik\n4. Kontrollwünsche\n5. Art der Berichterstattung\n6. Termine\n7. Budgetrahmen\n8. Dokumentation / Kontakt"}, {"k": "Prozess und Briefing", "q": "Briefing 2: Angaben zum Informationsproblem", "a": "• Untersuchungsziel «Was wollen wir wissen?»\n• Themenkreis und Programmfragen\n• Arbeitshypothesen"}, {"k": "Prozess und Briefing", "q": "Briefing 3: Forschungsstrategie und -technik", "a": "• Methodenwahl inkl. Begründung Wahl / Nichtwahl\n• Grundgesamtheit\n• Vollerhebung oder Stichprobe\n• Stichprobengrösse, tolerierbare Fehlergrösse\n• Auswahlverfahren"}, {"k": "Prozess und Briefing", "q": "Briefing 4: Kontrollwünsche", "a": "Interviewer-Auswahl, Probeinterviews, Einblick in Fragebogen, Rücklaufkontrolle, Anwesenheit bei Testinstruktionen / Gruppendiskussionen"}, {"k": "Prozess und Briefing", "q": "Briefing 5 und 6: Berichterstattung und Termine", "a": "Berichterstattung: schriftlicher Bericht, Grafiken, Präsentation / Workshop, elektronische Datenform.\nTermine: Planung, Pilot, Feldarbeit, Berichterstattung, Projektabschluss."}, {"k": "Prozess und Briefing", "q": "Beurteilung der Marktforschungsofferte", "a": "• Vollständigkeit\n• Verständnis für die Probleme des Auftraggebers\n• Angepasstheit der Methode\n• Zweckmässigkeit von Organisation und Auswertung\n• Pilot?\n• Interviewer-Briefing im Beisein des Auftraggebers?\n• Stellenwert der Datenqualität\n• Gewicht der Berichterstattung\n• Preis-/Leistungsrelation\n• Bekanntheit / Image des Instituts"}, {"k": "Testarten und Sonderformen", "q": "Testarten und Marketing-Mix (4P)", "a": "• Product: Produktetests\n• Promotion: Werbemitteltests\n• Price: Preisfindungstest\n• Placement: Mystery Shopping"}, {"k": "Testarten und Sonderformen", "q": "Produktetests", "a": "• Produkteakzeptanz-Test\n• Geschmackstest\n• Gebrauchs- und Eignungstest\n• Blindtest\n• Konzepttest / «as market»\n• Packungstest\n• Preisgestaltung"}, {"k": "Testarten und Sonderformen", "q": "Werbemitteltests", "a": "Pretest vor, Posttest nach der Kampagne.\n• Recognition Test = Wiedererkennung\n• Aided Recall = gestützte Bekanntheit\n• Unaided Recall = ungestützte Bekanntheit\n• Werbetracking = wiederkehrende Messung\n• Copytest = gemäss Kriterien der Copyplattform"}, {"k": "Testarten und Sonderformen", "q": "Mystery Shopping", "a": "Anonyme Testkäufer überprüfen Servicequalität und Kundenorientierung: Freundlichkeit, Beratungsqualität, Fachkompetenz, Zustand der Verkaufsräume."}, {"k": "Testarten und Sonderformen", "q": "Omnibus", "a": "Mehrthemenumfrage, mehrere Auftraggeber mit wenigen Fragen. Wöchentlich, repräsentativ für 14–74 Jahre. Online (E-Bus) oder telefonisch (Telebus)."}, {"k": "Testarten und Sonderformen", "q": "Omnibus: Kosten pro Frage (1'000 Interviews)", "a": "• Geschlossene Frage CHF 900\n• Skala-Frage CHF 1'200\n• Offene Frage CHF 1'500"}, {"k": "Testarten und Sonderformen", "q": "Omnibus: Vor- und Nachteil", "a": "Vorteil: wenige Fragen mit vertretbarem Aufwand.\nNachteil: Themen anderer Auftraggeber können die eigenen Resultate beeinträchtigen."}, {"k": "Testarten und Sonderformen", "q": "Weitere Sonderformen", "a": "• PKS – Demoscope: Psychologische Karte der Schweiz\n• MACH Consumer: grösste Schweizer Studie, 11'000 Interviews\n• Link im Auftrag der WEMF: Werbemittelaffinität\n• SINUS Milieu: Segmentation nach psychografischen Merkmalen\n• Euro Sozio Styls – GfK: Lebensstilforschung"}, {"k": "Panelforschung", "q": "Zwei Ansätze der Panelforschung", "a": "Detailhandelspanel und Haushaltpanel (Konsumentenpanel)."}, {"k": "Panelforschung", "q": "Detailhandelspanel", "a": "Misst die Verkäufe des Detailhandels (Kassen-Scannerdaten).\nFood / Near-Food: Nielsen IQ (Root LU). Non-Food: GfK (seit 2023 zu Nielsen IQ)."}, {"k": "Panelforschung", "q": "Daten des Detailhandelspanels", "a": "• Marktentwicklung\n• Marktanteile\n• Hitlisten / Topseller\n• Verkäufe des Handels\n• Lagerbestände\n• Distributionswerte (numerisch, gewichtet)\n• Verkaufspreise"}, {"k": "Panelforschung", "q": "Detailhandelspanel: Vor- und Nachteile", "a": "Vorteile: Verkaufssteuerung, Infos über den POS, Konkurrenzinformationen, inkl. Tessin, sehr genaue Abverkaufszahlen, Einkäufe aller Käufergruppen.\nNachteile: es fehlen Kioske und Fachhandel; keine Informationen über Käufer."}, {"k": "Panelforschung", "q": "Nicht abgedeckt im Nielsen-Food-Panel", "a": "• Discounter (Aldi, Lidl)\n• HOREKA (Cash & Carry)\n• Tankstellen / Kioske\n• Spezialgeschäfte"}, {"k": "Panelforschung", "q": "Haushaltpanel", "a": "3'000 repräsentative Haushalte (D- und F-CH), Handscanner, Kassenbon oder EAN. Ungenauer als das Detailhandelspanel, aber Käuferanalysen möglich. Für Non-Food gibt es in der Schweiz keines."}, {"k": "Panelforschung", "q": "Daten des Haushaltpanels", "a": "• Marktentwicklung und Marktanteile\n• Durchschnittspreise\n• Verteileranteile (Coop, Migros, Denner, Aldi, Lidl)\n• Käuferstruktur\n• Einkaufsmenge pro Haushalt\n• Wiederkaufsraten\n• Käuferwanderungen"}, {"k": "Panelforschung", "q": "Haushaltpanel: Vor- und Nachteile", "a": "Vorteile: alle Produkte des täglichen Bedarfs, Konsumentendaten, alle Kanäle (auch Aldi, Lidl), Käuferanalysen, Haushaltstruktur.\nNachteile: nur private Haushalte, keine Lagerdaten, Impuls- und Ausser-Haus-Konsum fehlen, Tessin nicht abgedeckt, Verzerrung bei heiklen Categorys, keine Distributionskennzahlen."}, {"k": "Institute und Datenschutz", "q": "Marktforschungsinstitute", "a": "International: Nielsen IQ, GfK, IPSOS (TNS, NPD nicht in CH).\nNational: LINK (Luzern), DemoSCOPE (Adligenswil), GfS (Bern), ISO Public (Schwerzenbach)."}, {"k": "Institute und Datenschutz", "q": "EDÖB", "a": "Eidg. Datenschutz- und Öffentlichkeitsbeauftragter, Sitz Bern. Berät Private, beaufsichtigt Private und Bundesorgane, erstattet dem Bundesrat Bericht zum Öffentlichkeitsgesetz."}, {"k": "Institute und Datenschutz", "q": "Datenschutzgesetz", "a": "Bundesgesetz für Bundesbehörden und Private. Kantonale Behörden: kantonale Gesetze."}, {"k": "Institute und Datenschutz", "q": "Informationspflicht", "a": "In der Schweiz gilt neben der Auskunftspflicht auch die Informationspflicht: Betroffene müssen unaufgefordert informiert werden."}, {"k": "Institute und Datenschutz", "q": "Datenschutz bei Umfragen", "a": "Der Auftraggeber darf nicht den kompletten Adressbestand an das durchführende Unternehmen weitergeben."}, {"k": "Institute und Datenschutz", "q": "Adresshandel", "a": "Nicht verboten, aber enge Grenzen. Adresse kann für Werbezwecke gesperrt werden."}, {"k": "Institute und Datenschutz", "q": "Datenübermittlung ins Ausland", "a": "Daten müssen ausreichend geschützt sein (Art. 7 DSG): Integrität, Vertraulichkeit und Verfügbarkeit sichern."}];
const $=id=>document.getElementById(id);
let st={};try{st=JSON.parse(localStorage.getItem("mafo-trainer")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("mafo-trainer",JSON.stringify(st))}catch(e){}};
const kaps=[...new Set(D.map(d=>d.k))];
$("kap").innerHTML='<option value="">Alle Kapitel ('+D.length+' Karten)</option>'+kaps.map(k=>`<option>${k}</option>`).join("");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>{const k=$("kap").value;return D.map((d,i)=>({...d,i})).filter(d=>!k||d.k===k)};
function stats(){const p=pool(),ok=p.filter(d=>st[d.i]==="ok").length,no=p.filter(d=>st[d.i]==="no").length;
$("stats").innerHTML=`<span class="chip ok"><b>${ok}</b> gewusst</span><span class="chip bad"><b>${no}</b> Lücken</span><span class="chip"><b>${p.length-ok-no}</b> offen</span>`;
$("bar").style.width=(p.length?ok/p.length*100:0)+"%"}
let onlyWrong=false,deck=[],ci=0;
function newDeck(){deck=sh(pool().filter(d=>!onlyWrong||st[d.i]==="no"));ci=0;showCard()}
function showCard(){stats();$("ca").hidden=true;$("r2").hidden=true;$("r1").hidden=false;
if(!deck.length){$("ck").textContent="";$("cq").textContent=onlyWrong?"Keine Lücken mehr.":"Keine Karten.";$("r1").hidden=true;return}
if(ci>=deck.length){deck=sh(deck);ci=0}
const d=deck[ci];$("ck").textContent=d.k;$("cq").textContent=d.q;$("ca").textContent=d.a}
function reveal(){if(!deck.length||$("r1").hidden)return;$("ca").hidden=false;$("r1").hidden=true;$("r2").hidden=false}
function mark(v){if($("r2").hidden)return;const d=deck[ci];st[d.i]=v;save();ci++;showCard()}
$("show").onclick=reveal;$("yes").onclick=()=>mark("ok");$("no").onclick=()=>mark("no");
$("onlyWrong").onclick=()=>{onlyWrong=!onlyWrong;$("onlyWrong").setAttribute("aria-pressed",onlyWrong);$("onlyWrong").classList.toggle("primary",onlyWrong);newDeck()};
function resetUI(){$("resetBox").innerHTML='<button id="reset">Zurücksetzen</button>';$("reset").onclick=askReset}
function askReset(){$("resetBox").innerHTML='<span class="hint">Wirklich alles zurücksetzen?</span><button class="miss" id="rY">Ja</button><button id="rN">Abbrechen</button>';
$("rY").onclick=()=>{st={};save();resetUI();newDeck()};$("rN").onclick=resetUI}
$("reset").onclick=askReset;
document.addEventListener("keydown",e=>{if($("v-cards").hidden||e.target.tagName==="SELECT")return;
if(e.code==="Space"){e.preventDefault();reveal()}else if(e.key==="ArrowRight")mark("ok");else if(e.key==="ArrowLeft")mark("no")});
let qd=[],qi=0,score=0,ans=0;
function newQuiz(){qd=sh(pool()).slice(0,10);qi=0;score=0;ans=0;showQ()}
function showQ(){$("next").hidden=true;$("qs").textContent=qd.length?`${Math.min(qi+1,qd.length)}/${qd.length}`:"";
if(qi>=qd.length){$("qk").textContent="Resultat";$("qq").textContent=`${score}/${qd.length} richtig`;
$("opts").innerHTML='<button class="primary" id="again">Neues Quiz</button>';$("again").onclick=newQuiz;return}
const d=qd[qi];$("qk").textContent=d.k;$("qq").textContent=d.q;
let o=sh(D.filter(x=>x.a!==d.a&&x.k===d.k));if(o.length<3)o=o.concat(sh(D.filter(x=>x.a!==d.a&&x.k!==d.k)));
const opts=sh([d,...o.slice(0,3)]);$("opts").innerHTML="";
opts.forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x.a;
b.onclick=()=>{if(!$("next").hidden)return;ans++;
if(x.a===d.a){score++;b.classList.add("right");if(!st[d.i])st[d.i]="ok"}else{b.classList.add("wrong");st[d.i]="no";
[...$("opts").children].forEach((c,j)=>{if(opts[j].a===d.a)c.classList.add("right")})}
save();stats();$("qs").textContent=`${qi+1}/${qd.length}`;$("next").hidden=false;$("next").focus()};$("opts").appendChild(b)})}
$("next").onclick=()=>{qi++;showQ()};

const P=[["Problem formulieren",["«Was will ich wissen?»","Untersuchungsziel definieren","Untersuchungsgegenstände (z.B. Marktanteile)"]],
["Checkphase",["Bestimmung der Informationsquellen","Was ist vorhanden (sekundär)?","Was muss ermittelt werden (primär)?","Entscheid zur Primärforschung"]],
["Designphase",["Methode festlegen","Grundgesamtheit festlegen","Stichprobe und Auswahlverfahren","Entscheid MAFO-Institut","Timing und Budget bestimmen","Programmfragen definieren"]],
["Feldphase – Datengewinn",["Fragebogen erstellen","Interviewer-Auswahl","Interviewer-Schulung","Pilot (Probeinterviews)","Durchführung im Feld"]],
["Datenanalyse, Aufbereitung, Interpretation",["Fragebogen auswerten","Tabellen erstellen","Statistische Verfahren","Grafische Darstellungen","Schlussfolgerungen und Empfehlungen"]],
["Dokumentationsphase, Kommunikation, Umsetzung",["Schriftlicher Forschungsbericht","Präsentation / Workshop","Umsetzung Massnahmen"]]];
let pMode="ord";
function phOrd(){pMode="ord";$("p-ord").classList.add("primary");$("p-zu").classList.remove("primary");
let next=0,err=0;const area=$("p-area");area.innerHTML='<ol id="p-done" style="margin:0;padding-left:22px;display:grid;gap:4px"></ol><div id="p-pool" class="row"></div>';
$("p-msg").textContent="Phase 1?";
sh(P.map((x,i)=>i)).forEach(i=>{const b=document.createElement("button");b.textContent=P[i][0];
b.onclick=()=>{if(i===next){b.remove();const li=document.createElement("li");li.textContent=P[i][0];$("p-done").appendChild(li);next++;
if(next===6){$("p-msg").textContent=err?`${err} Fehler`:"Alles richtig";
const r=document.createElement("button");r.className="primary";r.textContent="Nochmals";r.onclick=phOrd;$("p-pool").appendChild(r)}
else $("p-msg").textContent=`Phase ${next+1}?`}
else{err++;b.classList.add("miss");setTimeout(()=>b.classList.remove("miss"),500);$("p-msg").textContent="Falsch."}};
$("p-pool").appendChild(b)})}
let zq=[],zi=0,zs=0;
function phZu(){pMode="zu";$("p-zu").classList.add("primary");$("p-ord").classList.remove("primary");
zq=sh(P.flatMap((x,i)=>x[1].map(s=>[s,i]))).slice(0,10);zi=0;zs=0;zShow()}
function zShow(){const area=$("p-area");
if(zi>=zq.length){area.innerHTML="";$("p-msg").textContent=`${zs}/${zq.length} richtig`;
const r=document.createElement("button");r.className="primary";r.textContent="Neue Runde";r.onclick=phZu;area.appendChild(r);return}
const [s,c]=zq[zi];area.innerHTML=`<p class="q">${s}</p>`;$("p-msg").textContent=`${zi+1}/${zq.length}`;
const btns=P.map((x,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=(i+1)+". "+x[0];
b.onclick=()=>{if(area.dataset.done==="1")return;area.dataset.done="1";if(i===c){zs++;b.classList.add("right")}else{b.classList.add("wrong");btns[c].classList.add("right")}
const n=document.createElement("button");n.className="primary";n.textContent="Weiter";n.onclick=()=>{zi++;area.dataset.done="";zShow()};area.appendChild(n);n.focus()};area.appendChild(b);return b})}
$("p-ord").onclick=phOrd;$("p-zu").onclick=phZu;
const modes=["cards","quiz","phasen"];
function setMode(m){modes.forEach(x=>{$("v-"+x).hidden=x!==m;$("m-"+x).setAttribute("aria-pressed",x===m)});
$("cardTools").hidden=m!=="cards";$("kap").hidden=m==="phasen";if(m==="quiz")newQuiz();if(m==="phasen"){pMode==="zu"?phZu():phOrd()}}
modes.forEach(m=>$("m-"+m).onclick=()=>setMode(m));
$("kap").onchange=()=>{newDeck();if(!$("v-quiz").hidden)newQuiz()};
newDeck();
</script></body></html>
